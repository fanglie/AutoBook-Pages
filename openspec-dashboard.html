<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSpec 提案面板</title>
<style>:root{--bg-page:#F5F7F9;--bg-card:#FFFFFF;--text-primary:#2D3436;--text-secondary:#636E72;--text-muted:#B2BEC3;--border-light:#F1F2F6;--expense:#EA8379;--income:#299D8F;--shadow-card:0 4px 12px rgba(0,0,0,0.05);--radius:12px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-page);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased}.container{max-width:1400px;margin:0 auto;padding:24px 24px 48px}h1{text-align:center;font-size:26px;font-weight:700;margin-bottom:8px}.subtitle{text-align:center;font-size:14px;color:var(--text-muted);margin-bottom:24px}.tab-bar{display:flex;gap:8px;margin-bottom:24px;justify-content:center}.tab-btn{padding:8px 20px;border:1px solid var(--border-light);border-radius:20px;background:var(--bg-card);color:var(--text-secondary);cursor:pointer;font-size:14px;font-weight:500;transition:all .2s}.tab-btn:hover{background:var(--bg-page)}.tab-btn.active{background:var(--income);color:#fff;border-color:var(--income)}.tab-btn .count{display:inline-block;background:rgba(255,255,255,.3);border-radius:10px;padding:1px 6px;font-size:12px;margin-left:4px}.main-layout{display:flex;gap:24px;align-items:flex-start}.card-list{flex:0 0 55%;display:flex;flex-direction:column;gap:16px}.proposal-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-card);border:1px solid var(--border-light);cursor:pointer;transition:all .2s}.proposal-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}.proposal-card.selected{border-color:var(--income);box-shadow:0 0 0 2px rgba(41,157,143,.15)}.card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}.card-name{font-size:16px;font-weight:600;color:var(--text-primary);word-break:break-all}.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}.badge-active{background:#E8F5F2;color:var(--income)}.badge-archived{background:#F1F2F6;color:var(--text-muted)}.badge-schema{background:#FFF8E1;color:#F59E0B;font-size:10px}.card-summary{font-size:13px;color:var(--text-secondary);margin-bottom:12px;line-height:1.5}.progress-wrap{display:flex;align-items:center;gap:10px}.progress-bar{flex:1;height:6px;background:var(--border-light);border-radius:3px;overflow:hidden}.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--income),#5CBFAA);transition:width .3s}.progress-fill.no-progress{background:var(--border-light)}.progress-label{font-size:12px;color:var(--text-muted);white-space:nowrap;min-width:80px;text-align:right}.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--text-muted)}.detail-panel{flex:0 0 calc(45% - 24px);position:sticky;top:24px;background:var(--bg-card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-card);border:1px solid var(--border-light);max-height:calc(100vh - 48px);overflow-y:auto;display:none}.detail-panel.visible{display:block}.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.detail-title{font-size:20px;font-weight:700}.detail-close{width:32px;height:32px;border:none;background:var(--bg-page);border-radius:50%;cursor:pointer;font-size:18px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center}.detail-close:hover{background:var(--border-light)}.detail-section{margin-bottom:20px}.detail-section-title{font-size:14px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}.artifact-list{display:flex;flex-wrap:wrap;gap:8px}.artifact-item{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500}.artifact-done{background:#E8F5F2;color:var(--income)}.artifact-missing{background:#FFF0EE;color:var(--expense)}.detail-proposal{font-size:14px;line-height:1.7;color:var(--text-primary)}.detail-proposal h2{font-size:16px;font-weight:600;margin:16px 0 8px;color:var(--text-primary)}.detail-proposal h2:first-child{margin-top:0}.detail-proposal p{margin-bottom:8px}.detail-proposal ul{padding-left:20px;margin-bottom:8px}.detail-proposal li{margin-bottom:4px}.task-group{margin-bottom:16px}.task-group-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px}.task-item{display:flex;align-items:flex-start;gap:6px;font-size:13px;margin-bottom:3px;color:var(--text-secondary)}.task-item.done{color:var(--text-muted);text-decoration:line-through}.task-check{flex-shrink:0;width:16px;text-align:center}.task-check.checked{color:var(--income)}.detail-path{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-page);border-radius:8px;font-size:12px;font-family:'Consolas','Monaco',monospace;color:var(--text-secondary)}.copy-btn{padding:2px 8px;border:1px solid var(--border-light);border-radius:4px;background:var(--bg-card);cursor:pointer;font-size:11px;color:var(--text-secondary)}.copy-btn:hover{background:var(--bg-page)}.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:15px}.lock-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(45,52,54,.5);z-index:10000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}.lock-overlay.hidden{display:none}.lock-card{background:var(--bg-card);border-radius:16px;padding:40px 36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.15);max-width:380px;width:90%;text-align:center}.lock-icon{width:56px;height:56px;margin:0 auto 20px;background:linear-gradient(135deg,#299D8F,#5CBFAA);border-radius:50%;display:flex;align-items:center;justify-content:center}.lock-icon svg{width:28px;height:28px;fill:#fff}.lock-title{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:8px}.lock-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:24px}.lock-input{width:100%;padding:12px 16px;border:2px solid var(--border-light);border-radius:10px;font-size:15px;outline:none;color:var(--text-primary);background:var(--bg-page);transition:border-color .2s}.lock-input:focus{border-color:var(--income)}.lock-input::placeholder{color:var(--text-muted)}.lock-btn{width:100%;padding:12px;margin-top:16px;background:linear-gradient(135deg,#299D8F,#5CBFAA);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s,box-shadow .2s}.lock-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(41,157,143,.3)}.lock-btn:active{transform:translateY(0)}.lock-error{font-size:13px;color:var(--expense);margin-top:12px;display:none}@media(max-width:900px){.main-layout{flex-direction:column}.card-list{flex:none;width:100%}.detail-panel{flex:none;width:100%;position:static;max-height:none}}</style>
</head>

        <div class="lock-title">数据已加密</div>

<script>
(function(){function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function md2h(md){var ls=md.split('\n'),h='',ul=false;ls.forEach(function(l){var m=l.match(/^##\s+(.*)/);if(m){if(ul){h+='</ul>';ul=false}h+='<h2>'+esc(m[1])+'</h2>';return}var li=l.match(/^[-*]\s+(.*)/);if(li){if(!ul){h+='<ul>';ul=true}h+='<li>'+esc(li[1])+'</li>';return}if(ul){h+='</ul>';ul=false}if(l.trim())h+='<p>'+esc(l)+'</p>'});if(ul)h+='</ul>';return h}
function render(d,filter){var list=document.getElementById('cardList');list.innerHTML='';var f=d.filter(function(p){if(filter==='active')return!p.is_archived;if(filter==='archived')return p.is_archived;return true});if(!f.length){list.innerHTML='<div class="empty-state">没有匹配的提案</div>';return}f.forEach(function(p){var idx=d.indexOf(p);var c=document.createElement('div');c.className='proposal-card'+(idx===sel?' selected':'');var bc=p.is_archived?'badge-archived':'badge-active';var bt=p.is_archived?'已归档':'活跃';var sc=p.summary==='(无简介)'?'card-summary no-summary':'card-summary';var pw=p.tasks_progress.percent>0?p.tasks_progress.percent:0;var pf=pw>0?'progress-fill':'progress-fill no-progress';c.innerHTML='<div class="card-header"><span class="card-name">'+esc(p.name)+'</span><span class="badge '+bc+'">'+bt+'</span><span class="badge badge-schema">'+esc(p.schema)+'</span></div><div class="'+sc+'">'+esc(p.summary)+'</div><div class="progress-wrap"><div class="progress-bar"><div class="'+pf+'" style="width:'+pw+'%"></div></div><span class="progress-label">'+esc(p.tasks_progress.label)+'</span></div><div class="card-footer"><span>'+(p.created||'')+'</span><span>'+esc(p.path)+'</span></div>';c.addEventListener('click',function(){toggle(idx)});list.appendChild(c)})}
function toggle(i){if(sel===i){hide();return}sel=i;show(i);render(data,curF)}
function show(i){var p=data[i],panel=document.getElementById('detailPanel'),ct=document.getElementById('detailContent');var bc=p.is_archived?'badge-archived':'badge-active',bt=p.is_archived?'已归档':'活跃';var h='<div class="detail-header"><div><span class="detail-title">'+esc(p.name)+'</span> <span class="badge '+bc+'">'+bt+'</span></div><button class="detail-close" onclick="window._cd()">&times;</button></div>';h+='<div class="detail-section"><div class="detail-section-title">Artifacts</div><div class="artifact-list">';var an={proposal:'Proposal',design:'Design',tasks:'Tasks',specs:'Specs'};var ak={'proposal':'proposal.md','design':'design.md','tasks':'tasks.md','specs':'specs/'};for(var k in an){var dn=p.artifacts[ak[k]];h+='<span class="artifact-item '+(dn?'artifact-done':'artifact-missing')+'">'+(dn?'✓':'○')+' '+an[k]+'</span>'}h+='</div></div>';if(p.proposal_content)h+='<div class="detail-section"><div class="detail-section-title">Proposal</div><div class="detail-proposal">'+md2h(p.proposal_content)+'</div></div>';if(p.tasks_progress&&p.tasks_progress.groups&&p.tasks_progress.groups.length){h+='<div class="detail-section"><div class="detail-section-title">任务列表 ('+p.tasks_progress.done+'/'+p.tasks_progress.total+')</div>';p.tasks_progress.groups.forEach(function(g){h+='<div class="task-group"><div class="task-group-title">'+esc(g.title)+' ('+g.done+'/'+g.total+')</div>';g.tasks.forEach(function(t){h+='<div class="task-item'+(t.done?' done':'')+'"><span class="task-check'+(t.done?' checked':'')+'">'+(t.done?'✓':'○')+'</span><span>'+esc(t.desc)+'</span></div>'});h+='</div>'});h+='</div>'}h+='<div class="detail-section"><div class="detail-section-title">路径</div><div class="detail-path"><span>'+esc(p.path)+'</span><button class="copy-btn" onclick="window._cp(''+esc(p.path)+'')">复制</button></div></div>';ct.innerHTML=h;panel.classList.add('visible')}
function hide(){sel=-1;document.getElementById('detailPanel').classList.remove('visible');render(data,curF)}
window._cd=hide;window._cp=function(p){navigator.clipboard.writeText(p).then(function(){document.querySelectorAll('.copy-btn').forEach(function(b){b.textContent='已复制!';setTimeout(function(){b.textContent='复制'},1e3)})})};
var data=window.__PROPOSAL_DATA||[];var curF='all';var sel=-1;
document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');curF=b.getAttribute('data-filter');hide();render(data,curF)})});
render(data,'all');
function tryDecrypt(pwd){if(!pwd)pwd=document.getElementById('lockPassword').value;if(!pwd)return;var ed=window.ledgerData;if(!ed){document.getElementById('lockError').textContent='加密数据未加载';document.getElementById('lockError').style.display='block';return}var kb=CryptoJS.SHA256(pwd),iv=CryptoJS.enc.Base64.parse(ed.iv),ct=CryptoJS.enc.Base64.parse(ed.ct),dec=CryptoJS.AES.decrypt({ciphertext:ct},kb,{iv:iv,mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7}),pt=dec.toString(CryptoJS.enc.Utf8);if(!pt){document.getElementById('lockError').style.display='block';document.getElementById('lockPassword').value='';document.getElementById('lockPassword').focus();return}var payload;try{payload=JSON.parse(pt)}catch(e){document.getElementById('lockError').style.display='block';return}document.getElementById('lockOverlay').classList.add('hidden');history.replaceState(null,'','#'+encodeURIComponent(pwd));if(payload.proposals)window.__PROPOSAL_DATA=payload.proposals;data=window.__PROPOSAL_DATA;render(data,'all')}
window._tryUnlock=tryDecrypt;
document.getElementById('lockPassword').addEventListener('keydown',function(e){if(e.key==='Enter')tryDecrypt()});
(function(){var r=window.location.hash.substring(1);if(!r)return;var h=decodeURIComponent(r),ed=window.ledgerData;if(!ed)return;var kb=CryptoJS.SHA256(h),iv=CryptoJS.enc.Base64.parse(ed.iv),ct=CryptoJS.enc.Base64.parse(ed.ct),dec=CryptoJS.AES.decrypt({ciphertext:ct},kb,{iv:iv,mode:CryptoJS.mode.CBC,padding:CryptoJS.pad.Pkcs7}),pt=dec.toString(CryptoJS.enc.Utf8);if(pt){var p;try{p=JSON.parse(pt)}catch(e){return}document.getElementById('lockOverlay').classList.add('hidden');if(p.proposals)window.__PROPOSAL_DATA=p.proposals;data=window.__PROPOSAL_DATA;render(data,'all')}})()})();</script>
