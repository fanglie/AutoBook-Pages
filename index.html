<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泡泡君的自动账本</title>
<meta name="secure-template-version" content='secure-template-version-7.1' />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='14' width='5' height='15' rx='1' fill='%23EA8379'/><rect x='10' y='8' width='5' height='21' rx='1' fill='%23299D8F'/><rect x='17' y='18' width='5' height='11' rx='1' fill='%23EA8379' opacity='.65'/><rect x='24' y='4' width='5' height='25' rx='1' fill='%23299D8F' opacity='.65'/><polyline points='4,12 12,6 20,16 28,2' fill='none' stroke='%232D3436' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>" type="image/svg+xml">
<script src="./crypto-js.min.js"></script>
<script src="./echarts.min.js"></script>
<script src="./tailwindcss.min.js"></script>
<style>
:root {
    --bg-page: #F5F7F9;
    --bg-card: #FFFFFF;
    --text-primary: #1E293B;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --border-light: #E2E8F0;
    --expense: #EF4444;
    --income: #10B981;
    --shadow-card: 0 4px 12px rgba(0,0,0,0.06);
    --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}
.container { max-width: 1400px; margin: 0 auto; padding: 24px 24px 48px; }
h1 {
    text-align: center; font-size: 26px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 20px; letter-spacing: 0.5px;
}
.title-row { display: inline-flex; align-items: center; gap: 0; }
.version-badge {
    font-size: 12px; font-weight: 400; color: var(--text-muted);
    margin-left: 8px; vertical-align: middle; white-space: nowrap;
}
.data-freshness-badge {
    position: relative; display: inline-block;
    font-size: 13px; color: var(--text-secondary); font-weight: 400;
    cursor: default; margin-top: 4px; user-select: none;
}
.data-freshness-badge:hover .freshness-tooltip,
.data-freshness-badge:focus-within .freshness-tooltip {
    display: block;
}
.freshness-tooltip {
    display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    background: var(--bg-card); border: 1px solid var(--border-light);
    border-radius: var(--radius); padding: 12px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 100;
    min-width: 320px; margin-top: 8px; font-size: 12px;
}
.freshness-tooltip table { width: 100%; border-collapse: collapse; }
.freshness-tooltip th {
    text-align: left; padding: 4px 8px; font-weight: 500;
    color: var(--text-muted); border-bottom: 1px solid var(--border-light);
}
.freshness-tooltip td {
    padding: 4px 8px; color: var(--text-secondary);
}

/* loading */
.loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-page); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
}
.loading-overlay.hidden { display: none; }
.loading-spinner {
    width: 40px; height: 40px; border: 3px solid var(--border-light);
    border-top-color: var(--income); border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-muted); }
.loading-error { color: var(--expense); font-size: 14px; display: none; }

/* two-column layout */
.two-col {
    display: flex; gap: 24px; align-items: flex-start; overflow: hidden;
}
.left-col {
    flex: 0 0 calc(50% - 12px); max-width: calc(50% - 12px); min-width: 0;
}
.right-col {
    flex: 0 0 calc(50% - 12px); max-width: calc(50% - 12px); min-width: 0; overflow-x: hidden;
    position: sticky; top: 16px; height: calc(100vh - 32px);
    display: flex; flex-direction: column;
}
.right-col .section { margin-bottom: 0; }
#fullTxnSection {
    flex: 1; overflow-y: auto; min-height: 0;
    scrollbar-width: thin; scrollbar-color: var(--border-light) transparent;
    overscroll-behavior-y: contain;
    position: relative;
}
#fullTxnSection:focus { outline: none; }
#fullTxnSection::-webkit-scrollbar { width: 6px; }
#fullTxnSection::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
#txnListBody { padding: 0 4px; overflow: hidden; }
#txnListBody.elastic-transition { transition: transform 0.3s ease-out; }
@keyframes slide-out-down { from { transform: translateY(0); } to { transform: translateY(100%); } }
@keyframes slide-out-up { from { transform: translateY(0); } to { transform: translateY(-100%); } }
@keyframes slide-in-down { from { transform: translateY(-100%); } to { transform: translateY(0); } }
@keyframes slide-in-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
#txnListBody.anim-slide-out-down { animation: slide-out-down 0.4s ease-in forwards; }
#txnListBody.anim-slide-out-up { animation: slide-out-up 0.4s ease-in forwards; }
#txnListBody.anim-slide-in-down { animation: slide-in-down 0.4s ease-out forwards; }
#txnListBody.anim-slide-in-up { animation: slide-in-up 0.4s ease-out forwards; }
.boundary-toast {
    position: sticky; top: 0; z-index: 10; text-align: center;
    padding: 8px 16px; font-size: 13px; color: var(--text-secondary);
    background: rgba(245,247,249,0.92); border-radius: 0 0 8px 8px;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
.boundary-toast.show { opacity: 1; }

/* month nav */
.month-nav {
    display: flex; align-items: center; justify-content: center;
    position: relative; gap: 24px; margin-bottom: 28px;
}
.month-nav .month-title {
    font-size: 30px; font-weight: 700; color: var(--text-primary);
    cursor: pointer; user-select: none; letter-spacing: 1px;
    padding: 4px 16px; border-radius: var(--radius); transition: background .2s;
}
.month-nav .month-title:hover { background: var(--bg-page); }
.month-nav button {
    background: var(--bg-card); border: 1px solid var(--border-light); color: var(--text-secondary);
    width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
    font-size: 24px; transition: all .2s; box-shadow: var(--shadow-card);
}
.month-nav button:hover { background: var(--bg-page); color: var(--text-primary); }
.month-nav select {
    position: absolute; opacity: 0; pointer-events: none;
}

/* summary cards */
.cards {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    margin-bottom: 28px;
}
.card {
    background: var(--bg-card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow-card);
}
.card .label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
.card .value { font-size: 28px; font-weight: 700; color: var(--text-primary); }
.card .value.expense-color { color: var(--expense); }
.card .value.income-color { color: var(--income); }
.card .change { font-size: 12px; margin-top: 8px; color: var(--text-muted); }
.card .change.up { color: var(--expense); }
.card .change.down { color: var(--income); }

/* section cards */
.section {
    background: var(--bg-card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow-card); margin-bottom: 20px;
}
.section-title {
    font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border-light);
}
.chart-row {
    display: flex; gap: 24px; flex-wrap: wrap;
}
.chart-box {
    flex: 1; min-width: 320px; min-height: 380px;
}
.chart-box-side {
    flex: 0 0 260px; min-height: 380px;
}

/* rank list */
.rank-list { list-style: none; padding: 0; }
.rank-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border-light); font-size: 14px;
    color: var(--text-secondary);
}
.rank-list li:last-child { border-bottom: none; }
.rank-list .rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg-page); font-size: 12px; font-weight: 600;
    color: var(--text-muted); margin-right: 12px;
    flex-shrink: 0;
}
.rank-list .rank.r1 { background: var(--expense); color: #fff; }
.rank-list .rank.r2 { background: #F0A58E; color: #fff; }
.rank-list .rank.r3 { background: #7EB8DA; color: #fff; }
.rank-list .amt { color: var(--expense); font-weight: 600; font-size: 14px; }
.rank-list .pct { color: var(--text-muted); font-size: 12px; margin-left: 6px; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 14px; }
.txn-hint { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0; }

/* balance table */
.bal-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.bal-table th {
    text-align: left; padding: 10px 12px; font-weight: 500; font-size: 12px;
    color: var(--text-muted); border-bottom: 2px solid var(--border-light);
    background: var(--bg-page);
}
.bal-table th:not(:first-child) { text-align: right; }
.bal-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--border-light);
    color: var(--text-secondary);
}
.bal-table td:not(:first-child) { text-align: right; font-weight: 500; }
.bal-table td.bal-asset { color: var(--income); }
.bal-table td.bal-debt { color: var(--expense); }
.bal-table td.bal-zero { color: var(--text-muted); }
.bal-table .bal-summary td {
    border-top: 2px solid var(--border-light); border-bottom: none;
    font-weight: 700; color: var(--text-primary); padding-top: 12px;
}
.bal-source { font-size: 10px; color: var(--text-muted); margin-left: 4px;
    display: inline-block; background: var(--bg-page); padding: 1px 5px;
    border-radius: 3px; font-weight: 400; vertical-align: middle; }
.bal-name { color: var(--text-primary); font-weight: 500; }
.bal-hint { text-align: center; padding: 24px 20px; color: var(--text-muted); font-size: 13px; }

/* household fund flow modal */
.household-btn {
    position: absolute; right: 0; padding: 8px 18px; border-radius: 20px;
    border: 1px solid var(--border-light); background: var(--bg-card);
    color: var(--text-secondary); font-size: 13px; font-weight: 500;
    cursor: pointer; box-shadow: var(--shadow-card); transition: all .2s;
    white-space: nowrap;
}
.household-btn:hover { background: var(--income); color: #fff; border-color: var(--income); }
.hh-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45); z-index: 2000;
    display: flex; align-items: center; justify-content: center;
}
.hh-modal-panel {
    background: var(--bg-card); border-radius: 16px;
    width: 90%; max-width: 900px; max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    overflow: hidden;
}
.hh-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border-light);
    flex-shrink: 0;
}
.hh-modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.hh-modal-close {
    width: 32px; height: 32px; border: none; background: var(--bg-page);
    border-radius: 50%; font-size: 20px; color: var(--text-secondary);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
}
.hh-modal-close:hover { background: var(--expense); color: #fff; }
.hh-modal-year-tabs {
    display: flex; gap: 0; padding: 12px 24px 0; flex-shrink: 0;
    border-bottom: 2px solid var(--border-light);
}
.hh-year-tab {
    padding: 8px 20px; font-size: 14px; font-weight: 500;
    color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
    margin-bottom: -2px; transition: all .15s;
}
.hh-year-tab:hover { color: var(--text-primary); }
.hh-year-tab.active { color: var(--income); border-bottom-color: var(--income); font-weight: 600; }
.hh-modal-month-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    padding: 16px 24px; flex-shrink: 0;
}
.hh-month-card {
    background: var(--bg-page); border-radius: 10px; padding: 12px;
    cursor: pointer; transition: all .15s; border: 2px solid transparent;
    text-align: center;
}
.hh-month-card:hover { background: var(--bg-card); box-shadow: var(--shadow-card); }
.hh-month-card.active { border-color: var(--income); background: #E8F5F2; }
.hh-month-card.hh-no-data { opacity: 0.5; cursor: default; }
.hh-month-card.hh-no-data:hover { background: var(--bg-page); box-shadow: none; }
.hh-mc-name { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.hh-income-tag { display: inline-block; border-radius: 10px; font-size: 11px; padding: 2px 8px; margin-bottom: 3px; font-weight: 500; }
.hh-tag-ok { background: #D1FAE5; color: #065F46; }
.hh-tag-err { background: #FEE2E2; color: #991B1B; }
.hh-modal-content {
    flex: 1; overflow-y: auto; padding: 20px 24px 24px;
    min-height: 0;
}
.hh-modal-content::-webkit-scrollbar { width: 6px; }
.hh-modal-content::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
.hh-summary-row {
    display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;
    padding: 12px 16px; background: var(--bg-page); border-radius: 10px;
}
.hh-summary-item { display: flex; flex-direction: column; gap: 2px; }
.hh-summary-label { font-size: 11px; color: var(--text-muted); }
.hh-summary-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hh-status-indicator {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 12px;
}
.hh-ind-ok { background: #E8F5F2; color: var(--income); }
.hh-ind-pending { background: #FFF0EE; color: var(--expense); }
.hh-ind-suspect { background: #FFF8E1; color: #F0A500; }
.hh-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-bottom: 20px; }
.hh-table th { text-align: left; padding: 8px 10px; font-weight: 500; font-size: 12px; color: var(--text-muted); border-bottom: 2px solid var(--border-light); background: var(--bg-page); }
.hh-table th:not(:first-child) { text-align: right; }
.hh-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-light); color: var(--text-secondary); }
.hh-table td:not(:first-child) { text-align: right; }
.hh-type-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.hh-tag-salary { background: #E3F2FD; color: #1565C0; }
.hh-tag-fund { background: #E8F5E9; color: #2E7D32; }
.hh-tag-bonus { background: #FFF3E0; color: #E65100; }
.hh-status-icon { font-size: 13px; font-weight: 600; }
.hh-icon-ok { color: var(--income); }
.hh-icon-pending { color: var(--expense); }
.hh-icon-suspect { color: #F0A500; }
.hh-reimb-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin: 16px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-light); }
@media (max-width: 768px) {
    .hh-modal-panel { width: 100%; max-width: 100%; max-height: 100vh; border-radius: 0; }
    .hh-modal-month-grid { grid-template-columns: repeat(3, 1fr); }
}

/* calendar */
#calendarSection { background: var(--bg-card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-card); margin-bottom: 20px; }
.cal-cell {
    background: var(--bg-card); border-radius: 6px; padding: 4px 2px; text-align: center;
    cursor: pointer; min-height: 50px; transition: all .15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px solid transparent;
}
.cal-cell:hover { background: var(--bg-page); }
.cal-cell.today { border-color: var(--income); }
.cal-cell.selected { border-color: var(--expense); background: #FFF5F5; }
.cal-day-num { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.cal-cell.today .cal-day-num { color: var(--income); }
.cal-expense { font-size: 12px; color: var(--expense); line-height: 1.2; }
.cal-income { font-size: 12px; color: var(--income); line-height: 1.2; }

/* search */
.search-box { margin: 16px 0; text-align: center; position: relative; }
.search-box input {
    width: 100%; max-width: 400px; padding: 10px 16px; border: 1px solid var(--border-light);
    border-radius: 20px; font-size: 14px; outline: none; background: var(--bg-card);
    box-shadow: var(--shadow-card); color: var(--text-primary);
}
.search-box input:focus { border-color: var(--income); }
.search-box input::placeholder { color: var(--text-muted); }
.search-box input.filter-active { border-color: var(--expense); box-shadow: 0 0 0 2px rgba(234,131,121,0.2); }

/* filter row */
.filter-row {
    display: flex; align-items: center; gap: 8px; padding: 0 0 4px; flex-wrap: nowrap;
    font-size: 12px; overflow-x: auto;
}
.type-btn-group { display: flex; gap: 0; flex-shrink: 0; }
.type-btn {
    padding: 3px 8px; border: 1px solid var(--border-light); background: var(--bg-card);
    font-size: 11px; cursor: pointer; color: var(--text-secondary); transition: all .15s;
    white-space: nowrap;
}
.type-btn:first-child { border-radius: 10px 0 0 10px; }
.type-btn:last-child { border-radius: 0 10px 10px 0; }
.type-btn:not(:first-child) { margin-left: -1px; }
.type-btn.active { background: var(--income); color: #fff; border-color: var(--income); z-index: 1; }
.filter-reset-btn {
    padding: 3px 10px; border: 1px solid var(--border-light); border-radius: 10px;
    font-size: 11px; cursor: pointer; color: var(--text-muted); background: var(--bg-card);
    white-space: nowrap; flex-shrink: 0; transition: all .15s;
}
.filter-reset-btn:hover { background: var(--bg-page); color: var(--text-primary); }

/* search summary */
.search-summary {
    display: none; padding: 10px 14px; margin-bottom: 8px; border-radius: 8px;
    background: var(--bg-page); font-size: 13px; color: var(--text-secondary);
    gap: 16px; align-items: center;
}
.search-summary.visible { display: flex; }
.search-summary .ss-item { white-space: nowrap; }
.search-summary .ss-count { font-weight: 600; color: var(--text-primary); }
.search-summary .ss-expense { font-weight: 600; color: var(--expense); }
.search-summary .ss-income { font-weight: 600; color: var(--income); }
.search-summary .ss-truncate { color: var(--text-muted); font-style: italic; }

/* search month group */
.month-group-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 0 6px; margin-top: 8px;
    border-bottom: 2px solid var(--border-light); cursor: pointer;
    font-size: 15px; font-weight: 700; color: var(--income);
    transition: color .15s;
}
.month-group-header:hover { color: var(--text-primary); }
.month-group-header .mgh-hint { font-size: 11px; font-weight: 400; color: var(--text-muted); }
.month-group-header:first-child { margin-top: 0; }

/* search mode calendar hint - removed */

/* global filter bar */
.global-filter-bar {
    max-width: 680px;
    margin: 0 auto 24px;
    text-align: center;
}
.global-filter-bar .search-box input {
    max-width: 100%;
    border-radius: 24px;
    padding: 12px 20px 12px 36px;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.global-filter-bar .filter-row {
    justify-content: center;
    margin-top: 8px;
}
.global-filter-bar .search-summary {
    margin-top: 8px;
}

/* calendar dimmed for search */
.cal-dimmed {
    opacity: 0.25 !important;
    pointer-events: none !important;
}

/* segmented tabs */
.seg-tabs {
    display: flex;
    background: var(--bg-page);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 20px;
    gap: 0;
}
.seg-tab {
    flex: 1;
    padding: 8px 0;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
}
.seg-tab.active {
    background: var(--income);
    color: #fff;
    box-shadow: 0 2px 6px rgba(16,185,129,0.3);
}
.seg-tab:not(.active):hover {
    color: var(--text-secondary);
}

/* toast */
#toastContainer {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9998;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
}
.toast-item {
    background: #fff;
    border-radius: 12px;
    padding: 12px 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text-primary);
    pointer-events: auto;
    opacity: 1;
    transition: opacity 0.3s;
}
.toast-item.fade-out {
    opacity: 0;
}
.toast-icon {
    color: var(--income);
    font-size: 18px;
    font-weight: 700;
}

/* mobile bottom nav */
.mobile-bottom-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 9990;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border-light);
    padding: 6px 0;
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
}
.mobile-nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    padding: 4px 0;
    transition: color .2s;
}
.mobile-nav-btn.active {
    color: var(--income);
}
.mobile-nav-btn svg {
    stroke: currentColor;
}

/* txn row — minimalist three-column layout */
.txn-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 12px 4px;
    gap: 12px;
    border-bottom: 1px solid #F8FAFC;
    position: relative;
    transition: background 0.15s ease;
}
.txn-row:last-child { border-bottom: none; }
.txn-row:hover { background: rgba(248,250,252,0.8); }
.txn-row:hover .copy-btn { opacity: 1; }
.txn-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    min-width: 0;
    position: relative;
}
.txn-cat-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #F1F5F9;
    color: #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    overflow: hidden;
}
.txn-cat-name {
    font-size: 14px;
    font-weight: 400;
    color: #334155;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100px;
}
.txn-dot-verified {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #60A5FA;
    position: absolute;
    top: -1px;
    left: 24px;
}
.txn-meta {
    flex: 1;
    font-size: 12px;
    color: #94A3B8;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
}
.txn-meta-sep {
    margin: 0 4px;
    color: #CBD5E1;
}
.txn-amount-lg {
    font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    white-space: nowrap;
    flex-shrink: 0;
}
.amt-expense { color: #EF4444; }
.amt-income { color: #10B981; }
.amt-refund { color: #94A3B8; }
.amt-transfer { color: #818CF8; }
.copy-btn {
    opacity: 0;
    font-size: 11px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-light);
    border-radius: 4px;
    padding: 2px 6px;
    cursor: pointer;
    transition: opacity 0.15s, color .15s, border-color .15s;
    white-space: nowrap;
    flex-shrink: 0;
}
.copy-btn:hover { background: var(--bg-page); color: var(--text-primary); }
.copy-btn.copied { color: var(--income); border-color: var(--income); }

/* mark highlight */
mark {
    background: rgba(234,131,121,0.25); color: inherit; padding: 0 2px;
    border-radius: 2px; font-weight: 500;
}

/* txn list */
.txn-section {
    background: var(--bg-card); border-radius: var(--radius); padding: 16px;
    box-shadow: var(--shadow-card);
}
.day-group { margin-bottom: 8px; }
.day-header {
    font-size: 14px; font-weight: 600; color: var(--text-primary); padding: 10px 0 6px;
    border-bottom: 1px solid var(--border-light); margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
}
.day-total { font-size: 12px; font-weight: 400; color: var(--text-muted); }
.txn-tooltip {
    position: fixed; z-index: 1000; background: rgba(0,0,0,0.8); color: #fff;
    padding: 4px 10px; border-radius: 4px; font-size: 12px; max-width: 300px;
    word-break: break-all; pointer-events: none; white-space: normal;
    display: none;
}

/* breadcrumb & filter tag */
#filterBreadcrumb {
    display: flex; align-items: center; gap: 4px; padding: 8px 0 4px;
    font-size: 13px; min-height: 28px; flex-shrink: 0;
}
#filterBreadcrumb .bc-item {
    color: var(--income); cursor: pointer; font-weight: 500;
}
#filterBreadcrumb .bc-item:hover { text-decoration: underline; }
#filterBreadcrumb .bc-item.bc-current {
    color: var(--text-primary); cursor: default; font-weight: 600;
}
#filterBreadcrumb .bc-item.bc-current:hover { text-decoration: none; }
#filterBreadcrumb .bc-sep {
    color: var(--text-muted); margin: 0 2px;
}
.filter-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 16px; font-size: 12px;
    background: #E8F5F2; color: var(--income); font-weight: 500;
    white-space: nowrap;
}
.filter-tag .filter-tag-close {
    cursor: pointer; font-size: 14px; font-weight: 700;
    margin-left: 2px; opacity: 0.6;
}
.filter-tag .filter-tag-close:hover { opacity: 1; }

/* footer */
.footer {
    text-align: center; font-size: 12px; color: var(--text-muted);
    margin-top: 12px; padding: 16px 0;
}

/* responsive breakpoints */
@media (min-width: 1200px) {
    #fullTxnSection { overflow-x: hidden; }
}
@media (min-width: 1024px) and (max-width: 1199px) {
    .two-col { overflow: hidden; }
    #fullTxnSection { overflow-x: auto; }
}
@media (max-width: 1023px) {
    .two-col { flex-direction: column; overflow: hidden; }
    .left-col { width: 100%; flex: none; }
    .right-col {
        position: static; height: auto; flex: none; width: 100%;
        max-width: 100%;
    }
    #fullTxnSection { max-height: 60vh; overflow-x: hidden; }
    .mobile-bottom-nav { display: flex; }
    body { padding-bottom: 64px; }
}

/* lock modal */
.lock-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(45,52,54,0.5); z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.lock-overlay.hidden { display: none; }
.lock-card {
    background: var(--bg-card); border-radius: 16px; padding: 40px 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15); max-width: 380px; width: 90%;
    text-align: center;
}
.lock-icon {
    width: 56px; height: 56px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #299D8F, #5CBFAA);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.lock-icon svg { width: 28px; height: 28px; fill: #fff; }
.lock-title {
    font-size: 18px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 8px;
}
.lock-subtitle {
    font-size: 13px; color: var(--text-muted); margin-bottom: 24px;
}
.lock-input {
    width: 100%; padding: 12px 16px; border: 2px solid var(--border-light);
    border-radius: 10px; font-size: 15px; outline: none;
    color: var(--text-primary); background: var(--bg-page);
    transition: border-color 0.2s;
}
.lock-input:focus { border-color: var(--income); }
.lock-input::placeholder { color: var(--text-muted); }
.lock-btn {
    width: 100%; padding: 12px; margin-top: 16px;
    background: linear-gradient(135deg, #299D8F, #5CBFAA);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
}
.lock-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(41,157,143,0.3); }
.lock-btn:active { transform: translateY(0); }
.lock-error {
    font-size: 13px; color: var(--expense); margin-top: 12px;
    display: none;
}
</style>
</head>

<script>

window.__DECRYPT_ENGINE = true;
function __aesDecrypt(encryptedData, password) {
    var keyBits = CryptoJS.SHA256(password);
    var iv = CryptoJS.enc.Base64.parse(encryptedData.iv);
    var ct = CryptoJS.enc.Base64.parse(encryptedData.ct);
    var decrypted = CryptoJS.AES.decrypt(
        { ciphertext: ct },
        keyBits,
        { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
    );
    var plaintext = decrypted.toString(CryptoJS.enc.Utf8);
    if (!plaintext) return null;
    try { return JSON.parse(plaintext); } catch(e) { return null; }
}

window._tryUnlock = function(pwd) {
    if (!pwd) pwd = document.getElementById('lockPassword').value;
    if (!pwd) return;
    var encryptedData = window.ledgerData;
    if (!encryptedData) {
        document.getElementById('lockError').textContent = '加密数据未加载';
        document.getElementById('lockError').style.display = 'block';
        return;
    }
    var payload = __aesDecrypt(encryptedData, pwd);
    if (!payload) {
        document.getElementById('lockError').style.display = 'block';
        document.getElementById('lockPassword').value = '';
        document.getElementById('lockPassword').focus();
        return;
    }
    document.getElementById('lockOverlay').classList.add('hidden');
    history.replaceState(null, '', '#' + encodeURIComponent(pwd));
    if (payload.report) {
        window.__REPORT_DATA = payload.report;
    }
    if (payload.details) {
        window.__REPORT_DETAILS = payload.details;
    }
    if (typeof window.__secureInit === 'function') window.__secureInit();
};

document.getElementById('lockPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') window._tryUnlock();
});

(function() {
    var raw = window.location.hash.substring(1);
    if (!raw) return;
    var hash = decodeURIComponent(raw);
    var encryptedData = window.ledgerData;
    if (!encryptedData) return;
    var payload = __aesDecrypt(encryptedData, hash);
    if (payload) {
        document.getElementById('lockOverlay').classList.add('hidden');
        if (payload.report) window.__REPORT_DATA = payload.report;
        if (payload.details) window.__REPORT_DETAILS = payload.details;
    }
})();

    function _buildTxnRowHtml(t, keyword) {
        var amtClass = t.ttype === '转账' ? 'amt-transfer' : t.ttype === '收入' ? 'amt-income' : t.ttype === '退款' ? 'amt-refund' : 'amt-expense';
        var timeStr = t.date.length >= 16 ? t.date.slice(11, 16) : '';
        var isTransferPair = t.ttype === '转账' && t.account.indexOf('→') >= 0;

        var catRaw = isTransferPair ? '转账' : (t.category1 || t.category2 || t.counterparty || '');
        var catIcon = _getCatIcon(isTransferPair ? '转账' : (t.category1 || t.category2 || ''));
        var catName = _highlightKeyword(catRaw || '-', keyword);
        var cpDisplay = isTransferPair ? _highlightKeyword(t.account, keyword) : _highlightKeyword(t.counterparty || '', keyword);
        var isMultiSource = t.all_sources && t.all_sources.length > 1;
        var sourceText = _buildSourceText(t);
        var flowLabel = t.flow_label || '';

        var html = '<div class="txn-row">';
        html += '<div class="txn-left">';
        if (isMultiSource) html += '<span class="txn-dot-verified"></span>';
        html += '<span class="txn-cat-icon">' + catIcon + '</span>';
        html += '<span class="txn-cat-name">' + catName + '</span>';
        html += '</div>';

        var metaParts = [];
        if (timeStr) metaParts.push(timeStr);
        metaParts.push(sourceText);
        if (cpDisplay) metaParts.push(cpDisplay);
        if (flowLabel) metaParts.push(flowLabel);
        var metaHtml = '';
        for (var mi = 0; mi < metaParts.length; mi++) {
            if (mi > 0) metaHtml += '<span class="txn-meta-sep">|</span>';
            metaHtml += metaParts[mi];
        }
        html += '<span class="txn-meta">' + metaHtml + '</span>';

        html += '<span class="txn-amount-lg ' + amtClass + '">' + formatAmount(t.amount, t.ttype) + '</span>';
        html += '<button class="copy-btn" onclick="window._copyTxnRef(this,' + t.id + ')" title="复制交易引用">复制</button>';
        html += '</div>';
        return html;
    }

    function renderSearchResults(keyword) {
        if (!detailsReady) {
            document.getElementById('txnListBody').innerHTML = '<div class="txn-hint">流水明细加载中，请稍候...</div>';
            return;
        }
        enterSearchMode();

        var allTxns = [];
        var months = Object.keys(TXN_DETAILS).sort().reverse();
        var kw = keyword ? keyword.toLowerCase() : '';

        for (var mi = 0; mi < months.length; mi++) {
            var month = months[mi];
            var days = Object.keys(TXN_DETAILS[month]);
            for (var di = 0; di < days.length; di++) {
                var day = days[di];
                var txns = TXN_DETAILS[month][day];
                for (var ti = 0; ti < txns.length; ti++) {
                    var t = txns[ti];
                    if (kw) {
                        var match = (t.counterparty || '').toLowerCase().indexOf(kw) >= 0 ||
                                    (t.category1 || '').toLowerCase().indexOf(kw) >= 0 ||
                                    (t.category2 || '').toLowerCase().indexOf(kw) >= 0 ||
                                    (t.account || '').toLowerCase().indexOf(kw) >= 0;
                        if (!match) continue;
                    }
                    if (typeFilter !== '全部' && t.ttype !== typeFilter) continue;
                    t._month = month;
                    t._day = day;
                    allTxns.push(t);
                }
            }
        }

        allTxns.sort(function(a, b) {
            if (a._month !== b._month) return a._month > b._month ? -1 : 1;
            if (a._day !== b._day) return a._day > b._day ? -1 : 1;
            return (a.date || '').localeCompare(b.date || '');
        });

        var truncated = allTxns.length > 500;
        if (truncated) allTxns = allTxns.slice(0, 500);

        var totalExp = 0, totalInc = 0;
        for (var i = 0; i < allTxns.length; i++) {
            if (allTxns[i].ttype === '支出') totalExp += allTxns[i].amount;
            else if (allTxns[i].ttype === '收入') totalInc += allTxns[i].amount;
        }

        var summaryEl = document.getElementById('searchSummary');
        var sumHtml = '<span class="ss-item">共 <span class="ss-count">' + allTxns.length + '</span> 笔</span>';
        if (totalExp > 0) sumHtml += '<span class="ss-item">支出 <span class="ss-expense">' + fmt(totalExp) + '</span></span>';
        if (totalInc > 0) sumHtml += '<span class="ss-item">收入 <span class="ss-income">' + fmt(Math.abs(totalInc)) + '</span></span>';
        if (truncated) sumHtml += '<span class="ss-item ss-truncate">结果过多，请缩小搜索范围</span>';
        summaryEl.innerHTML = sumHtml;
        summaryEl.classList.add('visible');

        var filterActive = typeFilter !== '全部';
        document.getElementById('txnSearch').classList.toggle('filter-active', filterActive);

        var html = '';
        var weekDayNames = ['周日','周一','周二','周三','周四','周五','周六'];
        var currentGrpMonth = '';

        for (var i = 0; i < allTxns.length; i++) {
            var t = allTxns[i];
            if (t._month !== currentGrpMonth) {
                currentGrpMonth = t._month;
                html += '<div class="month-group-header" onclick="window._jumpToMonth(&quot;' + t._month + '&quot;)">';
                html += _formatMonth(t._month);
                html += ' <span class="mgh-hint">点击查看该月</span></div>';
            }

            var dayParts = t._day.split('-');
            var dateObj = new Date(parseInt(dayParts[0]), parseInt(dayParts[1])-1, parseInt(dayParts[2]));
            var dayLabel = parseInt(dayParts[1]) + '月' + parseInt(dayParts[2]) + '日 ' + weekDayNames[dateObj.getDay()];

            if (i === 0 || allTxns[i-1]._day !== t._day || allTxns[i-1]._month !== t._month) {
                if (i > 0) html += '</div>';
                html += '<div class="day-group" id="day-' + t._day + '">';
                html += '<div class="day-header">' + dayLabel + '</div>';
            }

            html += _buildTxnRowHtml(t, keyword);
        }
        if (allTxns.length > 0) html += '</div>';
        if (allTxns.length === 0) {
            html = '<div class="empty-state">无匹配的交易记录</div>';
        }

        document.getElementById('txnListBody').innerHTML = html;
        _detectTruncation();

        var hitDays = {};
        for (var hi = 0; hi < allTxns.length; hi++) {
            hitDays[allTxns[hi]._day] = true;
        }
        _applyCalendarDimmed(hitDays);
    }

    var _txnTooltip = null;
    function _getTooltip() {
        if (!_txnTooltip) {
            _txnTooltip = document.createElement('div');
            _txnTooltip.className = 'txn-tooltip';
            document.body.appendChild(_txnTooltip);
        }
        return _txnTooltip;
    }
    function _detectTruncation() {
        var container = document.getElementById('txnListBody');
        if (!container) return;
        var selectors = ['.txn-account', '.txn-category', '.txn-counterparty'];
        selectors.forEach(function(sel) {
            var els = container.querySelectorAll(sel);
            for (var i = 0; i < els.length; i++) {
                var el = els[i];
                if (el.scrollWidth > el.clientWidth) {
                    (function(elem) {
                        elem.addEventListener('mouseenter', function(e) {
                            var tip = _getTooltip();
                            tip.textContent = elem.textContent;
                            tip.style.display = 'block';
                            var x = e.clientX + 10;
                            var y = e.clientY + 14;
                            tip.style.left = x + 'px';
                            tip.style.top = y + 'px';
                            requestAnimationFrame(function() {
                                var rect = tip.getBoundingClientRect();
                                if (rect.right > window.innerWidth - 8) {
                                    tip.style.left = (window.innerWidth - rect.width - 8) + 'px';
                                }
                            });
                        });
                        elem.addEventListener('mouseleave', function() {
                            _getTooltip().style.display = 'none';
                        });
                    })(el);
                }
            }
        });
    }

    function fmt(n) {
        if (n === undefined || n === null) return '--';
        return n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function formatAmount(amount, ttype) {
        var absVal = Math.abs(amount);
        if (ttype === '转账') return fmt(absVal);
        var sign = (ttype === '收入' || ttype === '退款') ? '+' : '-';
        return sign + fmt(absVal);
    }

    function pctChange(cur, prev) {
        if (!prev || prev === 0) return cur > 0 ? '+100.0%' : '0.0%';
        var p = ((cur - prev) / Math.abs(prev) * 100).toFixed(1);
        return (p >= 0 ? '+' : '') + p + '%';
    }

    function _formatMonth(m) {
        var parts = m.split('-');
        return parts[0] + '年' + parseInt(parts[1]) + '月';
    }

    function initSelect() {
        var sel = document.getElementById('monthSelect');
        var titleEl = document.getElementById('monthTitle');
        sel.innerHTML = '';
        ALL_MONTHS.forEach(function(m) {
            var opt = document.createElement('option');
            opt.value = m; opt.textContent = _formatMonth(m);
            sel.appendChild(opt);
        });
        sel.value = currentMonth;
        titleEl.textContent = _formatMonth(currentMonth);
        titleEl.onclick = function() { sel.showPicker ? sel.showPicker() : sel.focus(); };
        sel.onchange = function() {
            currentMonth = this.value;
            titleEl.textContent = _formatMonth(currentMonth);
            render();
        };
        document.getElementById('prevMonth').onclick = function() {
            var idx = ALL_MONTHS.indexOf(currentMonth);
            if (idx < ALL_MONTHS.length - 1) {
                currentMonth = ALL_MONTHS[idx + 1];
                sel.value = currentMonth;
                titleEl.textContent = _formatMonth(currentMonth);
                render();
            }
        };
        document.getElementById('nextMonth').onclick = function() {
            var idx = ALL_MONTHS.indexOf(currentMonth);
            if (idx > 0) {
                currentMonth = ALL_MONTHS[idx - 1];
                sel.value = currentMonth;
                titleEl.textContent = _formatMonth(currentMonth);
                render();
            }
        };
    }

    function _hhRenderMonthGrid() {
        var container = document.getElementById('hhMonthGrid');
        if (!container) return;
        var year = _hhModal.selectedYear;
        var html = '';
        for (var m = 1; m <= 12; m++) {
            var monthKey = year + '-' + String(m).padStart(2,'0');
            var hd = HOUSEHOLD_DATA[monthKey];
            var isSelected = monthKey === _hhModal.selectedMonth;
            if (hd && hd.rows && hd.rows.length > 0) {
                var typeOrder = ['工资', '公积金', '年终奖'];
                var typeMap = {};
                for (var ri = 0; ri < hd.rows.length; ri++) {
                    var r = hd.rows[ri];
                    var tp = r.type;
                    if (tp === '未分类收入' || tp === '其他') continue;
                    if (!typeMap[tp]) typeMap[tp] = {amount: 0, status: 'matched'};
                    typeMap[tp].amount += r.income_amount;
                    var st = r.status || 'pending';
                    var order = {suspect: 4, pending: 3, orphan: 2, matched: 1};
                    if ((order[st] || 0) > (order[typeMap[tp].status] || 0)) {
                        typeMap[tp].status = st;
                    }
                }
                var cardClass = 'hh-month-card' + (isSelected ? ' active' : '');
                html += '<div class="' + cardClass + '" data-month="' + monthKey + '">';
                html += '<div class="hh-mc-name">' + m + '月</div>';
                for (var ti = 0; ti < typeOrder.length; ti++) {
                    var tagName = typeOrder[ti];
                    var tagData = typeMap[tagName];
                    if (!tagData) continue;
                    var tagClass = tagData.status === 'matched' ? 'hh-tag-ok' : 'hh-tag-err';
                    html += '<div><span class="hh-income-tag ' + tagClass + '">' + tagName + ' ' + fmt(tagData.amount) + '</span></div>';

                var cardClass = 'hh-month-card hh-no-data' + (isSelected ? ' active' : '');
                html += '<div class="' + cardClass + '">';
                html += '<div class="hh-mc-name">' + m + '月</div>';

            cards[i].addEventListener('click', function() {
                _hhModal.selectedMonth = this.getAttribute('data-month');
                _hhRenderMonthGrid();
                _hhRenderContent();
            });

    function renderCalendar() {
        var calData = CALENDAR_DATA[currentMonth] || {};
        var parts = currentMonth.split('-');
        var year = parseInt(parts[0]), mon = parseInt(parts[1]);
        var firstDay = new Date(year, mon - 1, 1);
        var daysInMonth = new Date(year, mon, 0).getDate();
        var startDow = firstDay.getDay() - 1;
        if (startDow < 0) startDow = 6;

        var today = new Date();
        var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

        var weekDays = ['一', '二', '三', '四', '五', '六', '日'];
        var html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
        weekDays.forEach(function(d) {
            html += '<div style="text-align:center;font-size:12px;color:var(--text-muted);font-weight:500;padding:8px 0;">' + d + '</div>';
        });

        for (var i = 0; i < startDow; i++) {
            html += '<div style="min-height:52px;"></div>';
        }

        for (var d = 1; d <= daysInMonth; d++) {
            var dateStr = year + '-' + String(mon).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            var dd = calData[dateStr] || {};
            var exp = dd.expense || 0;
            var inc = dd.income || 0;
            var cls = 'cal-cell';
            if (dateStr === todayStr) cls += ' today';
            if (dateStr === selectedDate) cls += ' selected';

            html += '<div class="' + cls + '" data-date="' + dateStr + '" onclick="window._scrollToDay(this.dataset.date)">';
            html += '<span class="cal-day-num">' + d + '</span>';
            if (exp > 0) html += '<span class="cal-expense">' + (exp >= 10000 ? (exp/10000).toFixed(1)+'w' : exp >= 1000 ? (exp/1000).toFixed(1)+'k' : exp.toFixed(0)) + '</span>';
            if (inc > 0) html += '<span class="cal-income">+' + (inc >= 10000 ? (inc/10000).toFixed(1)+'w' : inc >= 1000 ? (inc/1000).toFixed(1)+'k' : inc.toFixed(0)) + '</span>';
            html += '</div>';
        }

        html += '</div>';
        document.getElementById('calendarGrid').innerHTML = html;
    }

    function renderTxnList(keyword) {
        if (!detailsReady) {
            document.getElementById('txnListBody').innerHTML = '<div class="txn-hint">流水明细加载中，请稍候...</div>';
            return;
        }

        var monthTxns = TXN_DETAILS[currentMonth] || {};
        var days = Object.keys(monthTxns).sort().reverse();

        var html = '';
        var hasAny = false;
        var weekDayNames = ['周日','周一','周二','周三','周四','周五','周六'];

        days.forEach(function(day) {
            var txns = monthTxns[day];
            if (currentFilter.type) {
                txns = txns.filter(function(t) {
                    if (currentFilter.type === 'category') return t.category1 === currentFilter.value;
                    if (currentFilter.type === 'subcategory') return t.category1 === currentFilter.cat1 && t.category2 === currentFilter.value;
                    if (currentFilter.type === 'account') return t.account.indexOf(currentFilter.value) >= 0;
                    return true;
                });
            }
            if (keyword) {
                var kw = keyword.toLowerCase();
                txns = txns.filter(function(t) {
                    return (t.counterparty || '').toLowerCase().indexOf(kw) >= 0 ||
                           (t.category1 || '').toLowerCase().indexOf(kw) >= 0 ||
                           (t.category2 || '').toLowerCase().indexOf(kw) >= 0 ||
                           (t.account || '').toLowerCase().indexOf(kw) >= 0;
                });
            }
            if (txns.length === 0) return;
            hasAny = true;

            var dayParts = day.split('-');
            var dateObj = new Date(parseInt(dayParts[0]), parseInt(dayParts[1])-1, parseInt(dayParts[2]));
            var dayLabel = parseInt(dayParts[1]) + '月' + parseInt(dayParts[2]) + '日 ' + weekDayNames[dateObj.getDay()];

            var dayExp = 0, dayInc = 0;
            txns.forEach(function(t) {
                if (t.ttype === '支出') dayExp += t.amount;
                else if (t.ttype === '收入') dayInc += t.amount;
            });

            html += '<div class="day-group" id="day-' + day + '">';
            html += '<div class="day-header">' + dayLabel;
            html += ' <span class="day-total">';
            if (dayExp > 0) html += '支 ' + fmt(dayExp);
            if (dayInc > 0) html += (dayExp > 0 ? ' / ' : '') + '收 ' + fmt(dayInc);
            html += '</span></div>';

            txns.forEach(function(t) {
                html += _buildTxnRowHtml(t, keyword);
            });

            html += '</div>';
        });

        if (!hasAny) {
            html = '<div class="empty-state">无匹配的交易记录</div>';
        }
        document.getElementById('txnListBody').innerHTML = html;
        _detectTruncation();
    }

        if (!section) return;

    function _switchMonth(direction) {
        var section = document.getElementById('fullTxnSection');
        var body = document.getElementById('txnListBody');
        if (!section || !body || isTransitioning) return;
        var idx = ALL_MONTHS.indexOf(currentMonth);
        var targetIdx = direction === 'down' ? idx + 1 : idx - 1;
        if (targetIdx < 0) { _showBoundaryToast('已是最早月份'); return; }
        if (targetIdx >= ALL_MONTHS.length) { _showBoundaryToast('已是最早月份'); return; }
        isTransitioning = true;
        _resetElastic();
        var outClass = direction === 'down' ? 'anim-slide-out-down' : 'anim-slide-out-up';
        body.classList.add(outClass);
        body.addEventListener('animationend', function onOut(e) {
            body.removeEventListener('animationend', onOut);
            body.classList.remove(outClass);
            currentMonth = ALL_MONTHS[targetIdx];
            var sel = document.getElementById('monthSelect');
            var titleEl = document.getElementById('monthTitle');
            if (sel) sel.value = currentMonth;
            if (titleEl) titleEl.textContent = _formatMonth(currentMonth);
            render();
            if (direction === 'down') {
                section.scrollTop = 0;
            } else {
                section.scrollTop = section.scrollHeight - section.clientHeight;
            }
            body = document.getElementById('txnListBody');
            if (!body) { isTransitioning = false; return; }
            var inClass = direction === 'down' ? 'anim-slide-in-down' : 'anim-slide-in-up';
            body.classList.add(inClass);
            body.addEventListener('animationend', function onIn(e) {
                body.removeEventListener('animationend', onIn);
                body.classList.remove(inClass);
                isTransitioning = false;
            });
        });
    }

    function handleWheel(e) {
        if (isTransitioning) { e.preventDefault(); return; }
        var section = document.getElementById('fullTxnSection');
        var body = document.getElementById('txnListBody');
        if (!section || !body) return;
        var atTop = section.scrollTop <= 1;
        var atBottom = section.scrollTop + section.clientHeight >= section.scrollHeight - 1;
        var atBoundary = false;
        if (atTop && e.deltaY < 0) atBoundary = true;
        if (atBottom && e.deltaY > 0) atBoundary = true;
        if (!atBoundary) return;
        e.preventDefault();
        var idx = ALL_MONTHS.indexOf(currentMonth);
        if ((atBottom && e.deltaY > 0 && idx >= ALL_MONTHS.length - 1) ||
            (atTop && e.deltaY < 0 && idx <= 0)) {
            _showBoundaryToast('已是最早月份');
            return;
        }
        var MAX_OFFSET = 60;
        var THRESHOLD = 80;
        var delta = Math.abs(e.deltaY);
        var damping = 1 - Math.abs(elasticOffset) / MAX_OFFSET;
        if (damping < 0.05) damping = 0.05;
        var step = delta * damping;
        elasticOffset += (e.deltaY > 0 ? 1 : -1) * step;
        if (elasticOffset > MAX_OFFSET) elasticOffset = MAX_OFFSET;
        if (elasticOffset < -MAX_OFFSET) elasticOffset = -MAX_OFFSET;
        elasticAccum += step;
        body.style.transform = 'translateY(' + elasticOffset + 'px)';
        if (elasticTimer) clearTimeout(elasticTimer);
        elasticTimer = setTimeout(function() {
            body.classList.add('elastic-transition');
            body.style.transform = 'translateY(0)';
            elasticOffset = 0;
            elasticAccum = 0;
            function onEnd(e) {
                body.removeEventListener('transitionend', onEnd);
                body.classList.remove('elastic-transition');
            }
            body.addEventListener('transitionend', onEnd);
            elasticTimer = null;
        }, 300);
        if (elasticAccum >= THRESHOLD) {
            var dir = e.deltaY > 0 ? 'down' : 'up';
            elasticAccum = 0;
            if (elasticTimer) { clearTimeout(elasticTimer); elasticTimer = null; }
            _switchMonth(dir);
        }
    }

    function render() {

                '<div class="empty-state" style="margin-top:100px;">请联网后刷新页面以加载图表库 (ECharts)</div>';
            return;
        }
        if (ALL_MONTHS.length === 0) {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.querySelector('.container').innerHTML =
                '<div class="empty-state" style="margin-top:100px;">无数据，请先运行 analyze.py 生成 data.js</div>';
            return;
        }
        currentMonth = ALL_MONTHS[0];

        function _triggerSearch() {
            if (isSearchActive()) {
                renderSearchResults(document.getElementById('txnSearch').value.trim());
            } else {
                if (searchMode) exitSearchMode();
                renderTxnList(document.getElementById('txnSearch').value);
            }
        }

        document.getElementById('txnSearch').addEventListener('input', function() {
            if (_searchDebounceTimer) clearTimeout(_searchDebounceTimer);
            _searchDebounceTimer = setTimeout(function() {
                _searchDebounceTimer = null;
                _triggerSearch();
            }, 200);
        });
        document.querySelectorAll('.type-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                typeFilter = this.getAttribute('data-type');
                document.querySelectorAll('.type-btn').forEach(function(b) {
                    b.classList.toggle('active', b.getAttribute('data-type') === typeFilter);
                });
                _triggerSearch();
            });
        });
        document.getElementById('filterResetBtn').addEventListener('click', function() {
            clearSearchMode();
        });
        window.addEventListener('resize', function() {
            if (expensePieChart) expensePieChart.resize();
            if (subPieChart) subPieChart.resize();
            if (accountChart) accountChart.resize();
        });

        document.querySelectorAll('.seg-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.seg-tab').forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                var target = this.getAttribute('data-tab');
                document.getElementById('consumeTab').style.display = target === 'consume' ? '' : 'none';
                document.getElementById('assetsTab').style.display = target === 'assets' ? '' : 'none';
                if (target === 'assets') {
                    if (accountChart) accountChart.resize();
                } else {
                    if (expensePieChart) expensePieChart.resize();
                    if (subPieChart) subPieChart.resize();
                }
            });
        });

        document.querySelectorAll('.mobile-nav-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mobile-nav-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                var view = this.getAttribute('data-view');
                document.querySelector('.left-col').style.display = view === 'dashboard' ? '' : 'none';
                document.querySelector('.right-col').style.display = view === 'transactions' ? '' : 'none';
                if (view === 'dashboard') {
                    if (expensePieChart) expensePieChart.resize();
                    if (accountChart) accountChart.resize();
                }
            });
        });

        initSelect();
        render();
        renderHouseholdFundFlow();
        _renderFreshness();

        var hhBtn = document.getElementById('householdBtn');
        if (hhBtn) {
            hhBtn.addEventListener('click', _hhOpenModal);
        }
        var hhClose = document.getElementById('hhModalClose');
        if (hhClose) {
            hhClose.addEventListener('click', _hhCloseModal);
        }
        var hhOverlay = document.getElementById('hhModalOverlay');
        if (hhOverlay) {
            hhOverlay.addEventListener('click', function(e) {
                if (e.target === hhOverlay) _hhCloseModal();
            });
        }
        var section = document.getElementById('fullTxnSection');
        if (section) {
            section.addEventListener('wheel', handleWheel, { passive: false });
            section.addEventListener('click', function() { section.focus(); });
            section.addEventListener('keydown', function(e) {
                if (e.key === 'PageDown') {
                    var remain = section.scrollHeight - section.clientHeight - section.scrollTop;
                    if (remain < section.clientHeight) {
                        e.preventDefault();
                        var idx = ALL_MONTHS.indexOf(currentMonth);
                        if (idx < ALL_MONTHS.length - 1) {
                            _switchMonth('down');
                        } else {
                            _showBoundaryToast('已是最早月份');
                        }
                    }
                } else if (e.key === 'PageUp') {
                    if (section.scrollTop <= 1) {
                        e.preventDefault();
                        var idx = ALL_MONTHS.indexOf(currentMonth);
                        if (idx > 0) {
                            _switchMonth('up');
                        } else {
                            _showBoundaryToast('已是最早月份');
                        }
                    }
                }
            });
        }
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function _findTxnById(txnId) {
        for (var mi in TXN_DETAILS) {
            for (var di in TXN_DETAILS[mi]) {
                var txns = TXN_DETAILS[mi][di];
                for (var i = 0; i < txns.length; i++) {
                    if (txns[i].id === txnId) return txns[i];
                }
            }
        }
        return null;
    }

    window._copyTxnRef = function(btn, txnId) {
        var t = _findTxnById(txnId);
        if (!t) return;
        var dateShort = t.date ? t.date.slice(0, 10) : '';
        var amountFmt = t.amount.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        var amountStr = (t.ttype === '收入' || t.ttype === '退款') ? '+' + amountFmt : amountFmt;
        var refText = '[交易#' + txnId + '] ' + dateShort + ' | ' + t.ttype + ' | ' + amountStr + ' | ' + (t.counterparty || '-') + ' | ' + (t.source_type || '');
        navigator.clipboard.writeText(refText).then(function() {
            btn.textContent = '已复制';
            btn.classList.add('copied');
            showToast('交易凭证已成功复制到剪贴板');
            setTimeout(function() {
                btn.textContent = '复制';
                btn.classList.remove('copied');
            }, 1200);
        });
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
