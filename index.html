<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账单分析</title>
<meta name="secure-template-version" content="secure-template-version-1.0" />
<script src="./crypto-js.min.js"></script>
<script src="./echarts.min.js"></script>
<style>
:root {
    --bg-page: #F5F7F9;
    --bg-card: #FFFFFF;
    --text-primary: #2D3436;
    --text-secondary: #636E72;
    --text-muted: #B2BEC3;
    --border-light: #F1F2F6;
    --expense: #EA8379;
    --income: #299D8F;
    --shadow-card: 0 4px 12px rgba(0,0,0,0.05);
    --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}
.container { max-width: 1400px; margin: 0 auto; padding: 24px 24px 48px; }
h1 {
    text-align: center; font-size: 22px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 20px; letter-spacing: 0.5px;
}

/* loading */
.loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-page); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
}
.loading-overlay.hidden { display: none; }
.loading-spinner {
    width: 40px; height: 40px; border: 3px solid var(--border-light);
    border-top-color: var(--income); border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-muted); }
.loading-error { color: var(--expense); font-size: 14px; display: none; }

/* lock modal */
.lock-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(45,52,54,0.5); z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.lock-overlay.hidden { display: none; }
.lock-card {
    background: var(--bg-card); border-radius: 16px; padding: 40px 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15); max-width: 380px; width: 90%;
    text-align: center;
}
.lock-icon {
    width: 56px; height: 56px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #299D8F, #5CBFAA);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.lock-icon svg { width: 28px; height: 28px; fill: #fff; }
.lock-title {
    font-size: 18px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 8px;
}
.lock-subtitle {
    font-size: 13px; color: var(--text-muted); margin-bottom: 24px;
}
.lock-input {
    width: 100%; padding: 12px 16px; border: 2px solid var(--border-light);
    border-radius: 10px; font-size: 15px; outline: none;
    color: var(--text-primary); background: var(--bg-page);
    transition: border-color 0.2s;
}
.lock-input:focus { border-color: var(--income); }
.lock-input::placeholder { color: var(--text-muted); }
.lock-btn {
    width: 100%; padding: 12px; margin-top: 16px;
    background: linear-gradient(135deg, #299D8F, #5CBFAA);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
}
.lock-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(41,157,143,0.3); }
.lock-btn:active { transform: translateY(0); }
.lock-error {
    font-size: 13px; color: var(--expense); margin-top: 12px;
    display: none;
}

/* two-column layout */
.two-col {
    display: flex; gap: 24px; align-items: flex-start;
}
.left-col {
    flex: 0 0 55%; max-width: 55%; min-width: 0;
}
.right-col {
    flex: 1; position: sticky; top: 16px; height: calc(100vh - 32px);
    display: flex; flex-direction: column;
}
.right-col .section { margin-bottom: 0; }
#calendarSection { flex-shrink: 0; }
#calendarSection .section-title { display: none; }
.cal-search-wrap { flex-shrink: 0; margin-bottom: 0; }
.cal-search-wrap .search-box { margin: 12px 0; }
#fullTxnSection {
    flex: 1; overflow-y: auto; min-height: 0;
    scrollbar-width: thin; scrollbar-color: var(--border-light) transparent;
}
#fullTxnSection::-webkit-scrollbar { width: 6px; }
#fullTxnSection::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
#txnListBody { padding: 0 4px; }

/* month nav */
.month-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-bottom: 28px;
}
.month-nav button {
    background: var(--bg-card); border: 1px solid var(--border-light); color: var(--text-secondary);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
    font-size: 18px; transition: all .2s; box-shadow: var(--shadow-card);
}
.month-nav button:hover { background: var(--bg-page); }
.month-nav select {
    background: var(--bg-card); border: 1px solid var(--border-light); color: var(--text-primary);
    padding: 8px 24px; border-radius: var(--radius); font-size: 15px; cursor: pointer;
    box-shadow: var(--shadow-card); font-weight: 500;
}
.month-nav select:focus { outline: none; border-color: var(--income); }

/* summary cards */
.cards {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    margin-bottom: 28px;
}
.card {
    background: var(--bg-card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow-card);
}
.card .label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
.card .value { font-size: 28px; font-weight: 700; color: var(--text-primary); }
.card .value.expense-color { color: var(--expense); }
.card .value.income-color { color: var(--income); }
.card .change { font-size: 12px; margin-top: 8px; color: var(--text-muted); }
.card .change.up { color: var(--expense); }
.card .change.down { color: var(--income); }

/* section cards */
.section {
    background: var(--bg-card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow-card); margin-bottom: 20px;
}
.section-title {
    font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border-light);
}
.chart-row {
    display: flex; gap: 24px; flex-wrap: wrap;
}
.chart-box {
    flex: 1; min-width: 320px; min-height: 380px;
}
.chart-box-side {
    flex: 0 0 260px; min-height: 380px;
}

/* rank list */
.rank-list { list-style: none; padding: 0; }
.rank-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border-light); font-size: 14px;
    color: var(--text-secondary);
}
.rank-list li:last-child { border-bottom: none; }
.rank-list .rank {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--bg-page); font-size: 12px; font-weight: 600;
    color: var(--text-muted); margin-right: 12px;
    flex-shrink: 0;
}
.rank-list .rank.r1 { background: var(--expense); color: #fff; }
.rank-list .rank.r2 { background: #F0A58E; color: #fff; }
.rank-list .rank.r3 { background: #7EB8DA; color: #fff; }
.rank-list .amt { color: var(--expense); font-weight: 600; font-size: 14px; }
.rank-list .pct { color: var(--text-muted); font-size: 12px; margin-left: 6px; }

/* txn detail */
.txn-list { list-style: none; padding: 0; }
.txn-list li {
    display: flex; align-items: center; padding: 14px 0;
    border-bottom: 1px solid var(--border-light); font-size: 13px;
    gap: 16px;
}
.txn-list li:last-child { border-bottom: none; }
.txn-list .txn-date {
    flex: 0 0 90px; color: var(--text-muted); font-size: 13px;
    font-variant-numeric: tabular-nums;
}
.txn-list .txn-amt {
    flex: 0 0 100px; text-align: right; color: var(--expense);
    font-weight: 600; font-variant-numeric: tabular-nums;
}
.txn-list .txn-acct {
    flex: 0 0 120px; color: var(--text-secondary); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.txn-list .txn-desc {
    flex: 1; color: var(--text-secondary); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.txn-list-header {
    display: flex; align-items: center; padding: 0 0 10px;
    font-size: 12px; color: var(--text-muted); font-weight: 500;
    gap: 16px; border-bottom: 1px solid var(--border-light);
    margin-bottom: 4px;
}
.txn-list-header span { }
.txn-list-header .th-date { flex: 0 0 90px; }
.txn-list-header .th-amt { flex: 0 0 100px; text-align: right; }
.txn-list-header .th-acct { flex: 0 0 120px; }
.txn-list-header .th-desc { flex: 1; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 14px; }
.txn-hint { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0; }

/* balance table */
.bal-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.bal-table th {
    text-align: left; padding: 10px 12px; font-weight: 500; font-size: 12px;
    color: var(--text-muted); border-bottom: 2px solid var(--border-light);
    background: var(--bg-page);
}
.bal-table th:not(:first-child) { text-align: right; }
.bal-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--border-light);
    color: var(--text-secondary);
}
.bal-table td:not(:first-child) { text-align: right; font-weight: 500; }
.bal-table td.bal-asset { color: var(--income); }
.bal-table td.bal-debt { color: var(--expense); }
.bal-table td.bal-zero { color: var(--text-muted); }
.bal-table .bal-summary td {
    border-top: 2px solid var(--border-light); border-bottom: none;
    font-weight: 700; color: var(--text-primary); padding-top: 12px;
}
.bal-source { font-size: 10px; color: var(--text-muted); margin-left: 4px;
    display: inline-block; background: var(--bg-page); padding: 1px 5px;
    border-radius: 3px; font-weight: 400; vertical-align: middle; }
.bal-name { color: var(--text-primary); font-weight: 500; }
.bal-hint { text-align: center; padding: 24px 20px; color: var(--text-muted); font-size: 13px; }

/* calendar */
#calendarSection { background: var(--bg-card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-card); }
.cal-cell {
    background: var(--bg-card); border-radius: 6px; padding: 4px 2px; text-align: center;
    cursor: pointer; min-height: 44px; transition: all .15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px solid transparent;
}
.cal-cell:hover { background: var(--bg-page); }
.cal-cell.today { border-color: var(--income); }
.cal-cell.selected { border-color: var(--expense); background: #FFF5F5; }
.cal-day-num { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.cal-cell.today .cal-day-num { color: var(--income); }
.cal-expense { font-size: 11px; color: var(--expense); line-height: 1.2; }
.cal-income { font-size: 11px; color: var(--income); line-height: 1.2; }

/* search */
.search-box { margin: 16px 0; text-align: center; }
.search-box input {
    width: 100%; max-width: 400px; padding: 10px 16px; border: 1px solid var(--border-light);
    border-radius: 20px; font-size: 14px; outline: none; background: var(--bg-card);
    box-shadow: var(--shadow-card); color: var(--text-primary);
}
.search-box input:focus { border-color: var(--income); }
.search-box input::placeholder { color: var(--text-muted); }

/* txn list */
.txn-section {
    background: var(--bg-card); border-radius: var(--radius); padding: 16px;
    box-shadow: var(--shadow-card);
}
.day-group { margin-bottom: 8px; }
.day-header {
    font-size: 14px; font-weight: 600; color: var(--text-primary); padding: 10px 0 6px;
    border-bottom: 1px solid var(--border-light); margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
}
.day-total { font-size: 12px; font-weight: 400; color: var(--text-muted); }
.txn-row {
    display: flex; align-items: center; padding: 10px 4px; gap: 12px;
    border-bottom: 1px solid var(--border-light); font-size: 13px;
}
.txn-row:last-child { border-bottom: none; }
.txn-time { flex: 0 0 44px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.txn-amount { flex: 0 0 90px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.amt-expense { color: var(--expense); }
.amt-income { color: var(--income); }
.amt-refund { color: var(--text-secondary); }
.txn-account { flex: 0 0 100px; color: var(--text-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txn-type {
    flex: 0 0 40px; font-size: 11px; padding: 2px 6px; border-radius: 4px;
    font-weight: 500; text-align: center;
}
.tag-expense { background: #FFF0EE; color: var(--expense); }
.tag-income { background: #E8F5F2; color: var(--income); }
.tag-refund { background: var(--bg-page); color: var(--text-secondary); }
.txn-category { flex: 0 0 70px; color: var(--text-secondary); font-size: 12px; }
.txn-counterparty { flex: 1; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txn-source {
    flex: 0 0 48px; font-size: 10px; color: var(--text-muted); background: var(--bg-page);
    padding: 1px 5px; border-radius: 3px; text-align: center;
}

/* footer */
.footer {
    text-align: center; font-size: 12px; color: var(--text-muted);
    margin-top: 12px; padding: 16px 0;
}
</style>
</head>
<body>
<div class="lock-overlay" id="lockOverlay">
    <div class="lock-card">
        <div class="lock-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></svg>
        </div>
        <div class="lock-title">数据已加密</div>
        <div class="lock-subtitle">请输入密码以解锁查看</div>
        <input class="lock-input" id="lockPassword" type="password" placeholder="输入密码" autofocus>
        <button class="lock-btn" id="lockBtn" onclick="window._tryUnlock()">解锁</button>
        <div class="lock-error" id="lockError">密码错误，请重试</div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">正在加载...</div>
    <div class="loading-error" id="loadingError"></div>
</div>
<div class="container">
    <h1>账单分析</h1>

    <div class="month-nav">
        <button id="prevMonth" title="上月">&lsaquo;</button>
        <select id="monthSelect"></select>
        <button id="nextMonth" title="下月">&rsaquo;</button>
    </div>

    <div class="two-col">
        <div class="left-col">
            <div class="cards">
                <div class="card">
                    <div class="label">总支出</div>
                    <div class="value expense-color" id="totalExpense">--</div>
                    <div class="change" id="expenseChange"></div>
                </div>
                <div class="card">
                    <div class="label">总收入</div>
                    <div class="value income-color" id="totalIncome">--</div>
                    <div class="change" id="incomeChange"></div>
                </div>
                <div class="card">
                    <div class="label">净额</div>
                    <div class="value" id="totalNet">--</div>
                    <div class="change" id="netChange"></div>
                </div>
            </div>

            <div class="section" id="balanceSection">
                <div class="section-title">月末账户余额</div>
                <div id="balanceBody"></div>
            </div>

            <div class="section">
                <div class="section-title">支出分类分析</div>
                <div class="chart-row">
                    <div class="chart-box" id="expensePieChart"></div>
                    <div class="chart-box-side">
                        <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;font-weight:500;">支出 TOP 5</div>
                        <ul class="rank-list" id="top5List"></ul>
                    </div>
                </div>
            </div>

            <div class="section" id="drilldownSection" style="display:none;">
                <div class="section-title" id="drilldownTitle">二级分类</div>
                <div class="chart-row">
                    <div class="chart-box" id="subPieChart"></div>
                    <div id="subDetails" style="flex:1;min-width:240px;"></div>
                </div>
            </div>

            <div class="section" id="txnDetailSection" style="display:none;">
                <div class="section-title" id="txnDetailTitle">交易明细</div>
                <div id="txnDetailBody"></div>
            </div>

            <div class="section">
                <div class="section-title">收入汇总</div>
                <div class="chart-row">
                    <div class="chart-box" id="incomeChart"></div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">账户支出分布</div>
                <div class="chart-row">
                    <div class="chart-box" id="accountChart"></div>
                </div>
            </div>

            <div class="footer" id="footerInfo"></div>
        </div>

        <div class="right-col">
            <div class="section" id="calendarSection">
                <div id="calendarGrid"></div>
            </div>
            <div class="cal-search-wrap">
                <div class="search-box">
                    <input id="txnSearch" type="text" placeholder="搜索交易：对方名称、分类、账户...">
                </div>
            </div>
            <div class="txn-section" id="fullTxnSection">
                <div id="txnListBody"></div>
            </div>
        </div>
    </div>
</div>

<script src="./data.js"></script>
<script>
(function() {
    var C_EXPENSE = '#EA8379';
    var C_INCOME = '#299D8F';

    var PALETTE = [];
    for (var i = 0; i < 20; i++) {
        PALETTE.push('hsl(' + (i * 47 + 200) % 360 + ', 45%, 65%)');
    }

    var selectedDate = null;
    var currentMonth = null;
    var expensePieChart, subPieChart, incomeChart, accountChart;
    var currentDrilldownCat1 = null;

    var ALL_MONTHS = [];
    var MONTH_DATA = {};
    var TXN_DETAILS = {};
    var BALANCE_DATA = {};
    var CALENDAR_DATA = {};
    var SOURCE_LABELS = {};
    var detailsReady = false;

    function aesDecrypt(encryptedData, password) {
        var keyBits = CryptoJS.SHA256(password);
        var iv = CryptoJS.enc.Base64.parse(encryptedData.iv);
        var ct = CryptoJS.enc.Base64.parse(encryptedData.ct);
        var decrypted = CryptoJS.AES.decrypt(
            { ciphertext: ct },
            keyBits,
            { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        var plaintext = decrypted.toString(CryptoJS.enc.Utf8);
        if (!plaintext) return null;
        try { return JSON.parse(plaintext); } catch(e) { return null; }
    }

    function loadDecryptedData(encryptedData, password) {
        var payload = aesDecrypt(encryptedData, password);
        if (!payload) return false;
        if (payload.report) {
            var d = payload.report;
            ALL_MONTHS = d.all_months || [];
            MONTH_DATA = d.month_data || {};
            BALANCE_DATA = d.balance_data || {};
            CALENDAR_DATA = d.calendar_data || {};
            SOURCE_LABELS = d.source_labels || {};
        }
        if (payload.details) {
            TXN_DETAILS = payload.details;
            detailsReady = true;
        }
        return true;
    }

    window._tryUnlock = function(pwd) {
        if (!pwd) pwd = document.getElementById('lockPassword').value;
        if (!pwd) return;
        var encryptedData = window.ledgerData;
        if (!encryptedData) {
            document.getElementById('lockError').textContent = '加密数据未加载';
            document.getElementById('lockError').style.display = 'block';
            return;
        }
        if (loadDecryptedData(encryptedData, pwd)) {
            document.getElementById('lockOverlay').classList.add('hidden');
            history.replaceState(null, '', '#' + encodeURIComponent(pwd));
            initApp();
        } else {
            document.getElementById('lockError').style.display = 'block';
            document.getElementById('lockPassword').value = '';
            document.getElementById('lockPassword').focus();
        }
    };

    document.getElementById('lockPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') window._tryUnlock();
    });

    function tryHashPassword() {
        var raw = window.location.hash.substring(1);
        if (!raw) return false;
        var hash = decodeURIComponent(raw);
        var encryptedData = window.ledgerData;
        if (!encryptedData) return false;
        if (loadDecryptedData(encryptedData, hash)) {
            document.getElementById('lockOverlay').classList.add('hidden');
            return true;
        }
        return false;
    }

    function fmt(n) {
        if (n === undefined || n === null) return '--';
        return n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function pctChange(cur, prev) {
        if (!prev || prev === 0) return cur > 0 ? '+100.0%' : '0.0%';
        var p = ((cur - prev) / Math.abs(prev) * 100).toFixed(1);
        return (p >= 0 ? '+' : '') + p + '%';
    }

    function initSelect() {
        var sel = document.getElementById('monthSelect');
        sel.innerHTML = '';
        ALL_MONTHS.forEach(function(m) {
            var opt = document.createElement('option');
            opt.value = m; opt.textContent = m;
            sel.appendChild(opt);
        });
        sel.value = currentMonth;
        sel.onchange = function() {
            currentMonth = this.value; render();
        };
        document.getElementById('prevMonth').onclick = function() {
            var idx = ALL_MONTHS.indexOf(currentMonth);
            if (idx < ALL_MONTHS.length - 1) {
                currentMonth = ALL_MONTHS[idx + 1]; sel.value = currentMonth; render();
            }
        };
        document.getElementById('nextMonth').onclick = function() {
            var idx = ALL_MONTHS.indexOf(currentMonth);
            if (idx > 0) {
                currentMonth = ALL_MONTHS[idx - 1]; sel.value = currentMonth; render();
            }
        };
    }

    function renderCards(md, prevMonth) {
        var t = md.totals;
        document.getElementById('totalExpense').textContent = fmt(t.expense);
        document.getElementById('totalIncome').textContent = fmt(t.income);

        var netEl = document.getElementById('totalNet');
        netEl.textContent = fmt(t.net);
        netEl.style.color = t.net >= 0 ? C_INCOME : C_EXPENSE;

        if (prevMonth && MONTH_DATA[prevMonth]) {
            var pt = MONTH_DATA[prevMonth].totals;
            var ec = pctChange(t.expense, pt.expense);
            var ic = pctChange(t.income, pt.income);
            var nc = pctChange(t.net, pt.net);

            var ece = document.getElementById('expenseChange');
            ece.textContent = '环比 ' + ec;
            ece.className = 'change ' + (t.expense >= pt.expense ? 'up' : 'down');

            var ice = document.getElementById('incomeChange');
            ice.textContent = '环比 ' + ic;
            ice.className = 'change ' + (t.income >= pt.income ? 'up' : 'down');

            var nce = document.getElementById('netChange');
            nce.textContent = '环比 ' + nc;
            nce.className = 'change ' + (t.net >= pt.net ? 'down' : 'up');
        } else {
            document.getElementById('expenseChange').textContent = '';
            document.getElementById('incomeChange').textContent = '';
            document.getElementById('netChange').textContent = '';
        }

        document.getElementById('footerInfo').textContent =
            '支出 ' + t.expense_count + ' 笔  ·  收入 ' + t.income_count + ' 笔  ·  退款 ' + t.refund_count + ' 笔';
    }

    function renderExpensePie(md) {
        var exp = md.expense;
        var total = md.totals.expense;
        if (total === 0) {
            document.getElementById('top5List').innerHTML = '<div class="empty-state">当月无支出</div>';
            return;
        }

        var sorted = Object.entries(exp).sort(function(a,b) { return b[1].total - a[1].total; });
        var pieData = sorted.map(function(e) {
            return {name: e[0], value: Math.round(e[1].total * 100) / 100};
        });

        if (!expensePieChart) {
            expensePieChart = echarts.init(document.getElementById('expensePieChart'));
            expensePieChart.on('click', function(params) {
                showDrilldown(params.name, md);
            });
        }
        expensePieChart.setOption({
            tooltip: {
                backgroundColor: '#fff', borderColor: '#eee', borderWidth: 1,
                textStyle: { color: '#2D3436', fontSize: 13 },
                formatter: function(p) {
                    return '<b>' + p.name + '</b><br/>金额: ' + fmt(p.value) + '<br/>占比: ' + p.percent + '%';
                }
            },
            color: PALETTE,
            series: [{
                type: 'pie', radius: ['42%', '72%'], center: ['50%', '50%'],
                avoidLabelOverlap: true,
                itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 3 },
                label: {
                    color: '#636E72', formatter: '{b}\n{d}%', fontSize: 12
                },
                emphasis: {
                    label: { fontSize: 14, fontWeight: 'bold', color: '#2D3436' },
                    itemStyle: { shadowBlur: 12, shadowColor: 'rgba(0,0,0,0.08)' }
                },
                data: pieData
            }],
            graphic: [{
                type: 'text', left: 'center', top: '44%',
                style: { text: '总支出', fill: '#B2BEC3', fontSize: 12 }
            }, {
                type: 'text', left: 'center', top: '51%',
                style: { text: fmt(total), fill: C_EXPENSE, fontSize: 16, fontWeight: 'bold' }
            }]
        });

        var top5 = sorted.slice(0, 5);
        var html = '';
        top5.forEach(function(e, i) {
            var pct = (e[1].total / total * 100).toFixed(1);
            var rc = i < 3 ? ' r' + (i+1) : '';
            html += '<li><span><span class="rank' + rc + '">' + (i+1) + '</span>' + e[0] + '</span>' +
                    '<span><span class="amt">' + fmt(e[1].total) + '</span><span class="pct">' + pct + '%</span></span></li>';
        });
        document.getElementById('top5List').innerHTML = html;

        document.getElementById('drilldownSection').style.display = 'none';
        document.getElementById('txnDetailSection').style.display = 'none';
        currentDrilldownCat1 = null;
    }

    function showDrilldown(cat1, md) {
        var exp = md.expense;
        if (!exp[cat1]) return;
        currentDrilldownCat1 = cat1;
        var sub = exp[cat1].sub;
        var catTotal = exp[cat1].total;
        var subEntries = Object.entries(sub).sort(function(a,b) { return b[1].total - a[1].total; });

        document.getElementById('txnDetailSection').style.display = 'none';

        if (subEntries.length === 0) {
            document.getElementById('drilldownSection').style.display = 'none';
            showTxnDetail(cat1, '');
            return;
        }

        document.getElementById('drilldownSection').style.display = '';
        document.getElementById('drilldownTitle').textContent = cat1 + ' — 二级分类（点击查看明细）';

        var pieData = subEntries.map(function(e) {
            return {name: e[0], value: Math.round(e[1].total * 100) / 100};
        });

        if (!subPieChart) {
            subPieChart = echarts.init(document.getElementById('subPieChart'));
        }
        subPieChart.off('click');
        subPieChart.on('click', function(params) {
            showTxnDetail(cat1, params.name);
        });
        subPieChart.setOption({
            tooltip: {
                backgroundColor: '#fff', borderColor: '#eee', borderWidth: 1,
                textStyle: { color: '#2D3436', fontSize: 13 },
                formatter: function(p) {
                    return '<b>' + p.name + '</b><br/>金额: ' + fmt(p.value) + '<br/>占比: ' + p.percent + '%';
                }
            },
            color: PALETTE.slice(5),
            series: [{
                type: 'pie', radius: ['38%', '68%'], center: ['50%', '50%'],
                avoidLabelOverlap: true,
                itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 3 },
                label: {
                    color: '#636E72', formatter: '{b}\n{d}%', fontSize: 12
                },
                emphasis: {
                    label: { fontSize: 14, fontWeight: 'bold', color: '#2D3436' },
                    itemStyle: { shadowBlur: 12, shadowColor: 'rgba(0,0,0,0.08)' }
                },
                data: pieData
            }],
            graphic: [{
                type: 'text', left: 'center', top: '44%',
                style: { text: cat1, fill: '#B2BEC3', fontSize: 12 }
            }, {
                type: 'text', left: 'center', top: '51%',
                style: { text: fmt(catTotal), fill: '#2D3436', fontSize: 15, fontWeight: 'bold' }
            }]
        });

        var detailHtml = '<ul class="rank-list">';
        subEntries.forEach(function(e, i) {
            var pct = (e[1].total / catTotal * 100).toFixed(1);
            var rc = i < 3 ? ' r' + (i+1) : '';
            detailHtml += '<li><span><span class="rank' + rc + '">' + (i+1) + '</span>' + e[0] +
                          '</span><span><span class="amt">' + fmt(e[1].total) + '</span><span class="pct">' + pct + '%</span></span></li>';
        });
        detailHtml += '</ul>';
        document.getElementById('subDetails').innerHTML = detailHtml;
    }

    function showTxnDetail(cat1, cat2) {
        var section = document.getElementById('txnDetailSection');
        var titleEl = document.getElementById('txnDetailTitle');
        var bodyEl = document.getElementById('txnDetailBody');

        if (!detailsReady) {
            section.style.display = '';
            titleEl.textContent = cat1 + (cat2 ? ' / ' + cat2 : '') + ' — 交易明细';
            bodyEl.innerHTML = '<div class="txn-hint">流水明细加载中，请稍候...</div>';
            return;
        }

        var monthTxns = TXN_DETAILS[currentMonth] || {};
        var txns = [];
        Object.keys(monthTxns).forEach(function(day) {
            monthTxns[day].forEach(function(t) {
                if (t.category1 === cat1 && (!cat2 || t.category2 === cat2)) {
                    txns.push(t);
                }
            });
        });
        txns.sort(function(a, b) { return b.date.localeCompare(a.date); });

        section.style.display = '';
        titleEl.textContent = cat1 + (cat2 ? ' / ' + cat2 : '') + ' — 交易明细（' + txns.length + ' 笔）';

        if (txns.length === 0) {
            bodyEl.innerHTML = '<div class="empty-state">无交易记录</div>';
            return;
        }

        var html = '<div class="txn-list-header">' +
            '<span class="th-date">日期</span><span class="th-amt">金额</span>' +
            '<span class="th-acct">账户</span><span class="th-desc">对方/备注</span></div>' +
            '<ul class="txn-list">';
        txns.forEach(function(t) {
            var amountClass = t.ttype === '收入' ? 'style="color:#299D8F"' : t.ttype === '退款' ? 'style="color:#636E72"' : '';
            var sign = t.ttype === '收入' || t.ttype === '退款' ? '+' : '-';
            html += '<li>' +
                '<span class="txn-date">' + t.date.slice(0, 10) + '</span>' +
                '<span class="txn-amt" ' + amountClass + '>' + sign + fmt(t.amount) + '</span>' +
                '<span class="txn-acct">' + t.account + '</span>' +
                '<span class="txn-desc">' + (t.counterparty || '-') + '</span>' +
                '</li>';
        });
        html += '</ul>';
        bodyEl.innerHTML = html;
        section.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }

    function renderIncome(md) {
        var inc = md.income;
        var entries = Object.entries(inc).sort(function(a,b) { return b[1].total - a[1].total; });
        if (entries.length === 0) {
            if (incomeChart) incomeChart.clear();
            document.getElementById('incomeChart').innerHTML = '<div class="empty-state">当月无收入</div>';
            return;
        }

        var barData = entries.map(function(e) {
            return {name: e[0], value: Math.round(e[1].total * 100) / 100};
        });

        if (!incomeChart) {
            incomeChart = echarts.init(document.getElementById('incomeChart'));
        }
        incomeChart.setOption({
            tooltip: {
                backgroundColor: '#fff', borderColor: '#eee', borderWidth: 1,
                textStyle: { color: '#2D3436', fontSize: 13 },
                trigger: 'axis', axisPointer: { type: 'shadow' },
                formatter: function(params) {
                    var p = params[0];
                    return '<b>' + p.name + '</b><br/>金额: ' + fmt(p.value);
                }
            },
            grid: { left: 100, right: 40, top: 10, bottom: 30 },
            xAxis: {
                type: 'value',
                axisLabel: { color: '#B2BEC3', formatter: function(v) { return v >= 1000 ? (v/1000).toFixed(1) + 'k' : v; } },
                splitLine: { lineStyle: { color: '#F1F2F6' } }
            },
            yAxis: {
                type: 'category',
                data: barData.map(function(d) { return d.name; }).reverse(),
                axisLabel: { color: '#636E72', fontSize: 13 },
                axisLine: { show: false }, axisTick: { show: false }
            },
            series: [{
                type: 'bar',
                data: barData.map(function(d) { return d.value; }).reverse(),
                barWidth: '55%',
                itemStyle: {
                    borderRadius: [0, 6, 6, 0],
                    color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                        {offset: 0, color: '#299D8F'},
                        {offset: 1, color: '#5CBFAA'}
                    ])
                },
                emphasis: {
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            {offset: 0, color: '#1F8A7D'},
                            {offset: 1, color: '#4DB39E'}
                        ])
                    }
                }
            }]
        }, true);
    }

    function balClass(v) {
        if (v === null || v === undefined) return '';
        if (v > 0.005) return 'bal-asset';
        if (v < -0.005) return 'bal-debt';
        return 'bal-zero';
    }

    function balFmt(v) {
        if (v === null || v === undefined) return '--';
        return fmt(v);
    }

    function changeFmt(v) {
        if (v === null || v === undefined) return '--';
        var sign = v >= 0.005 ? '+' : '';
        return sign + fmt(v);
    }

    function renderBalance() {
        var bd = BALANCE_DATA[currentMonth];
        var body = document.getElementById('balanceBody');
        if (!bd || !bd.has_data) {
            body.innerHTML = '<div class="bal-hint">该月份无余额快照数据，无法计算月末余额</div>';
            return;
        }
        var rows = bd.rows;
        var html = '<table class="bal-table"><thead><tr>' +
            '<th style="min-width:140px">账户</th>' +
            '<th style="min-width:110px">月初余额</th>' +
            '<th style="min-width:110px">月末余额</th>' +
            '<th style="min-width:100px">月度变化</th>' +
            '</tr></thead><tbody>';
        rows.forEach(function(r) {
            html += '<tr>';
            html += '<td class="bal-name">' + r.name;
            if (r.source) html += '<span class="bal-source">' + r.source + '</span>';
            html += '</td>';
            html += '<td class="' + balClass(r.start) + '">' + balFmt(r.start) + '</td>';
            html += '<td class="' + balClass(r.end) + '">' + balFmt(r.end) + '</td>';
            html += '<td class="' + balClass(r.change) + '">' + changeFmt(r.change) + '</td>';
            html += '</tr>';
        });
        html += '<tr class="bal-summary">';
        html += '<td class="bal-name">净资产</td>';
        html += '<td class="' + balClass(bd.net_start) + '">' + balFmt(bd.net_start) + '</td>';
        html += '<td class="' + balClass(bd.net_end) + '">' + balFmt(bd.net_end) + '</td>';
        html += '<td class="' + balClass(bd.net_change) + '">' + changeFmt(bd.net_change) + '</td>';
        html += '</tr>';
        html += '</tbody></table>';
        body.innerHTML = html;
    }

    function renderAccount(md) {
        var accs = md.accounts;
        var entries = Object.entries(accs).sort(function(a,b) { return b[1] - a[1]; });
        if (entries.length === 0) {
            if (accountChart) accountChart.clear();
            document.getElementById('accountChart').innerHTML = '<div class="empty-state">无数据</div>';
            return;
        }

        var pieData = entries.map(function(e) {
            return {name: e[0], value: e[1]};
        });

        if (!accountChart) {
            accountChart = echarts.init(document.getElementById('accountChart'));
        }
        accountChart.setOption({
            tooltip: {
                backgroundColor: '#fff', borderColor: '#eee', borderWidth: 1,
                textStyle: { color: '#2D3436', fontSize: 13 },
                formatter: function(p) {
                    return '<b>' + p.name + '</b><br/>金额: ' + fmt(p.value) + '<br/>占比: ' + p.percent + '%';
                }
            },
            color: PALETTE.slice(3, 11),
            series: [{
                type: 'pie', radius: ['38%', '68%'], center: ['50%', '50%'],
                avoidLabelOverlap: true,
                itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 3 },
                label: {
                    color: '#636E72', formatter: '{b}\n{d}%', fontSize: 12
                },
                emphasis: {
                    label: { fontSize: 14, fontWeight: 'bold', color: '#2D3436' },
                    itemStyle: { shadowBlur: 12, shadowColor: 'rgba(0,0,0,0.08)' }
                },
                data: pieData
            }]
        }, true);
    }

    function renderCalendar() {
        var calData = CALENDAR_DATA[currentMonth] || {};
        var parts = currentMonth.split('-');
        var year = parseInt(parts[0]), mon = parseInt(parts[1]);
        var firstDay = new Date(year, mon - 1, 1);
        var daysInMonth = new Date(year, mon, 0).getDate();
        var startDow = firstDay.getDay() - 1;
        if (startDow < 0) startDow = 6;

        var today = new Date();
        var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

        var weekDays = ['一', '二', '三', '四', '五', '六', '日'];
        var html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
        weekDays.forEach(function(d) {
            html += '<div style="text-align:center;font-size:12px;color:var(--text-muted);font-weight:500;padding:8px 0;">' + d + '</div>';
        });

        for (var i = 0; i < startDow; i++) {
            html += '<div style="min-height:52px;"></div>';
        }

        for (var d = 1; d <= daysInMonth; d++) {
            var dateStr = year + '-' + String(mon).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            var dd = calData[dateStr] || {};
            var exp = dd.expense || 0;
            var inc = dd.income || 0;
            var cls = 'cal-cell';
            if (dateStr === todayStr) cls += ' today';
            if (dateStr === selectedDate) cls += ' selected';

            html += '<div class="' + cls + '" data-date="' + dateStr + '" onclick="window._scrollToDay(this.dataset.date)">';
            html += '<span class="cal-day-num">' + d + '</span>';
            if (exp > 0) html += '<span class="cal-expense">' + (exp >= 10000 ? (exp/10000).toFixed(1)+'w' : exp >= 1000 ? (exp/1000).toFixed(1)+'k' : exp.toFixed(0)) + '</span>';
            if (inc > 0) html += '<span class="cal-income">+' + (inc >= 10000 ? (inc/10000).toFixed(1)+'w' : inc >= 1000 ? (inc/1000).toFixed(1)+'k' : inc.toFixed(0)) + '</span>';
            html += '</div>';
        }

        html += '</div>';
        document.getElementById('calendarGrid').innerHTML = html;
    }

    function renderTxnList(keyword) {
        if (!detailsReady) {
            document.getElementById('txnListBody').innerHTML = '<div class="txn-hint">流水明细加载中，请稍候...</div>';
            return;
        }

        var monthTxns = TXN_DETAILS[currentMonth] || {};
        var days = Object.keys(monthTxns).sort().reverse();

        var html = '';
        var hasAny = false;
        var weekDayNames = ['周日','周一','周二','周三','周四','周五','周六'];

        days.forEach(function(day) {
            var txns = monthTxns[day];
            if (keyword) {
                var kw = keyword.toLowerCase();
                txns = txns.filter(function(t) {
                    return (t.counterparty || '').toLowerCase().indexOf(kw) >= 0 ||
                           (t.category1 || '').toLowerCase().indexOf(kw) >= 0 ||
                           (t.category2 || '').toLowerCase().indexOf(kw) >= 0 ||
                           (t.account || '').toLowerCase().indexOf(kw) >= 0;
                });
            }
            if (txns.length === 0) return;
            hasAny = true;

            var dayParts = day.split('-');
            var dateObj = new Date(parseInt(dayParts[0]), parseInt(dayParts[1])-1, parseInt(dayParts[2]));
            var dayLabel = parseInt(dayParts[1]) + '月' + parseInt(dayParts[2]) + '日 ' + weekDayNames[dateObj.getDay()];

            var dayExp = 0, dayInc = 0;
            txns.forEach(function(t) {
                if (t.ttype === '支出') dayExp += t.amount;
                else if (t.ttype === '收入') dayInc += t.amount;
            });

            html += '<div class="day-group" id="day-' + day + '">';
            html += '<div class="day-header">' + dayLabel;
            html += ' <span class="day-total">';
            if (dayExp > 0) html += '支 ' + fmt(dayExp);
            if (dayInc > 0) html += (dayExp > 0 ? ' / ' : '') + '收 ' + fmt(dayInc);
            html += '</span></div>';

            txns.forEach(function(t) {
                var amountClass = t.ttype === '收入' ? 'amt-income' : t.ttype === '退款' ? 'amt-refund' : 'amt-expense';
                var sign = t.ttype === '收入' || t.ttype === '退款' ? '+' : '-';
                var typeClass = t.ttype === '收入' ? 'tag-income' : t.ttype === '退款' ? 'tag-refund' : 'tag-expense';
                var srcLabel = SOURCE_LABELS[t.source_type] || t.source_type;
                var timeStr = t.date.length >= 16 ? t.date.slice(11, 16) : '';

                html += '<div class="txn-row">';
                html += '<span class="txn-time">' + timeStr + '</span>';
                html += '<span class="txn-amount ' + amountClass + '">' + sign + fmt(t.amount) + '</span>';
                html += '<span class="txn-account">' + t.account + '</span>';
                html += '<span class="txn-type ' + typeClass + '">' + t.ttype + '</span>';
                html += '<span class="txn-category">' + t.category1 + '</span>';
                html += '<span class="txn-counterparty">' + (t.counterparty || '-') + '</span>';
                html += '<span class="txn-source">' + srcLabel + '</span>';
                html += '</div>';
            });

            html += '</div>';
        });

        if (!hasAny) {
            html = '<div class="empty-state">无匹配的交易记录</div>';
        }
        document.getElementById('txnListBody').innerHTML = html;
    }

    window._scrollToDay = function(dateStr) {
        selectedDate = dateStr;
        renderCalendar();
        var el = document.getElementById('day-' + dateStr);
        var container = document.getElementById('fullTxnSection');
        if (el && container) {
            container.scrollTo({ top: el.offsetTop - container.offsetTop - 10, behavior: 'smooth' });
        }
    };

    function render() {
        var md = MONTH_DATA[currentMonth];
        if (!md) return;
        var idx = ALL_MONTHS.indexOf(currentMonth);
        var prevMonth = idx < ALL_MONTHS.length - 1 ? ALL_MONTHS[idx + 1] : null;
        selectedDate = null;
        renderCards(md, prevMonth);
        renderBalance();
        renderCalendar();
        renderTxnList(document.getElementById('txnSearch').value);
        renderExpensePie(md);
        renderIncome(md);
        renderAccount(md);
    }

    function initApp() {
        if (typeof echarts === 'undefined') {
            document.querySelector('.container').innerHTML =
                '<div class="empty-state" style="margin-top:100px;">图表库加载失败，请检查 echarts.min.js 是否存在</div>';
            return;
        }
        if (ALL_MONTHS.length === 0) {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.querySelector('.container').innerHTML =
                '<div class="empty-state" style="margin-top:100px;">无数据</div>';
            return;
        }
        currentMonth = ALL_MONTHS[0];
        document.getElementById('txnSearch').addEventListener('input', function() {
            renderTxnList(this.value);
        });
        window.addEventListener('resize', function() {
            if (expensePieChart) expensePieChart.resize();
            if (subPieChart) subPieChart.resize();
            if (incomeChart) incomeChart.resize();
            if (accountChart) accountChart.resize();
        });
        initSelect();
        render();
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    if (!tryHashPassword()) {
        document.getElementById('lockOverlay').classList.remove('hidden');
        setTimeout(function() { document.getElementById('lockPassword').focus(); }, 100);
    } else {
        initApp();
    }
})();
</script>
</body>
</html>
